name: Deploy Totally Outdoors platform to joes-jarvis

# Deploys the Totally Outdoors platform (this branch) to the joes-jarvis Fly
# app, replacing whatever is currently serving there. NOTE: master's
# fly-deploy.yml also deploys to the same app on pushes to master — last push
# wins. Keep only one of the two active long-term.
on:
  push:
    branches: [totally-outdoors-prod]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to joes-jarvis
        run: flyctl deploy --remote-only -c fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
