name: Deploy totally-outdoors

# NOTE: this repo's master branch auto-deploys Joe's JARVIS (fly-deploy.yml on
# master) to the joes-jarvis Fly app. The Totally Outdoors platform lives on its
# own branch and deploys to its own Fly app with its own token secret so the two
# never collide. Push to totally-outdoors-prod (or run manually) to deploy.
on:
  push:
    branches: [totally-outdoors-prod]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy totally-outdoors
        run: flyctl deploy --remote-only -c fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.TOTALLY_OUTDOORS_FLY_API_TOKEN }}
