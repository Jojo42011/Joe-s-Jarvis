<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Paulie // Content Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --app-bg:#F4F7F9; --card:#FFFFFF; --card-2:#F8FAFB;
    --border:#E5EBEF; --border-strong:#D3DDE3;
    --text:#0E1B24; --body:#33454F; --muted:#6B7C86; --faint:#9AA9B2;
    --red:#D9301B; --red-hover:#BC2714; --red-soft:rgba(217,48,27,0.08);
    --teal:#15A6BC; --teal-deep:#0E8194; --teal-soft:rgba(21,166,188,0.10);
    /* legacy aliases kept so untouched rules still resolve */
    --bg:#F4F7F9; --bg-1:#FFFFFF; --crimson:#D9301B; --orange:#15A6BC; --orange-soft:#0E8194;
    --green:#12B76A; --violet:#7C3AED;
    --line:#E5EBEF; --line-strong:#D3DDE3; --glass:#FFFFFF;
    --shadow-sm:0 1px 2px rgba(14,27,36,0.06);
    --shadow:0 1px 3px rgba(14,27,36,0.07), 0 10px 26px -16px rgba(14,27,36,0.22);
    --shadow-lg:0 24px 60px -20px rgba(14,27,36,0.28);
    --orbit:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --ease-out:cubic-bezier(.22,.9,.3,1); --ease-pop:cubic-bezier(.34,1.4,.64,1);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; background:var(--app-bg); color:var(--text); font-family:var(--sans); -webkit-font-smoothing:antialiased; }

  #app { position:relative; z-index:2; max-width:1240px; margin:0 auto; padding:0 24px 70px; }

  /* light scrollbars */
  * { scrollbar-width:thin; scrollbar-color:#CBD5DB transparent; }
  *::-webkit-scrollbar { width:9px; height:9px; }
  *::-webkit-scrollbar-track { background:transparent; }
  *::-webkit-scrollbar-thumb { background:#CBD5DB; border-radius:8px; }
  *::-webkit-scrollbar-thumb:hover { background:#AEBCC4; }

  header#top { display:flex; align-items:center; justify-content:space-between; height:64px; position:sticky; top:0; z-index:5; background:rgba(244,247,249,0.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); }
  header#top .lhs { display:flex; align-items:center; gap:13px; }
  header#top .badge { width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 34% 30%, #3fc9dd, var(--teal-deep) 78%); position:relative; }
  header#top .badge::after { content:""; position:absolute; left:7px; top:6px; width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,0.85); }
  header#top .ttl { font-size:15px; font-weight:700; letter-spacing:-0.01em; color:var(--text); }
  header#top .ttl span { color:var(--muted); font-size:11px; font-weight:500; letter-spacing:0.02em; margin-left:2px; }
  header#top a.back { color:var(--teal-deep); text-decoration:none; font-size:12px; font-weight:600; letter-spacing:0.02em; transition:.15s; }
  header#top a.back:hover { color:var(--teal); }

  .btn { font-family:var(--sans); font-size:12.5px; font-weight:600; color:var(--body); background:var(--card); border:1px solid var(--border); padding:9px 15px; border-radius:9px; cursor:pointer; transition:.15s var(--ease-out); box-shadow:var(--shadow-sm); }
  .btn:hover { background:var(--card-2); border-color:var(--border-strong); }
  .btn:active { transform:translateY(0) scale(.99); }
  .btn.primary { position:relative; overflow:hidden; background:var(--red); color:#fff; border-color:transparent; box-shadow:0 1px 2px rgba(217,48,27,0.3); }
  .btn.primary:hover { background:var(--red-hover); box-shadow:0 4px 14px -4px rgba(217,48,27,0.5); }
  .btn.working { color:#fff; pointer-events:none; position:relative; overflow:hidden; }
  .btn.working::before { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.28),transparent); background-size:200% 100%; animation:shimmer 1.15s linear infinite; }
  .btn:focus-visible, .mini:focus-visible, .vt:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }

  /* view tabs */
  #views { display:flex; gap:6px; margin:22px 0 20px; flex-wrap:wrap; }
  .vt { position:relative; font-family:var(--sans); font-size:13px; font-weight:500; color:var(--muted); border:1px solid var(--border); background:var(--card); padding:9px 16px; border-radius:9px; cursor:pointer; transition:.15s var(--ease-out); box-shadow:var(--shadow-sm); }
  .vt:hover { color:var(--text); border-color:var(--border-strong); background:var(--card-2); }
  .vt.active { color:var(--teal-deep); border-color:var(--teal); background:var(--teal-soft); font-weight:600; }
  .tabct { display:inline-block; min-width:17px; text-align:center; margin-left:6px; padding:1px 6px; border-radius:9px;
    background:var(--red); color:#fff; font-weight:700; font-size:10px; animation:popIn .4s var(--ease-pop) both; }

  .view { display:none; }
  .view.active { display:block; animation:viewIn .4s var(--ease-out) both; }
  @keyframes viewIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none} }
  @keyframes rise   { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
  @keyframes popIn  { from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes shimmer{ from{background-position:200% 0} to{background-position:-200% 0} }
  @keyframes growW  { from{transform:scaleX(0)} to{transform:scaleX(1)} }
  @keyframes growH  { from{height:0} }
  @keyframes growFillW { from{width:0} }

  .grid { display:grid; gap:16px; }
  .card { position:relative; border:1px solid var(--border); border-radius:14px; background:var(--card); padding:20px; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s; }
  .card:hover { box-shadow:var(--shadow); }
  .card h3 { font-size:12px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; }

  /* KPI tiles */
  #kpis { grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .kpi { position:relative; border:1px solid var(--border); border-radius:14px; background:var(--card); padding:16px 18px; overflow:hidden; box-shadow:var(--shadow-sm); transition:transform .2s var(--ease-out), box-shadow .2s; }
  .kpi:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .kpi .lab { font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); }
  .kpi .num { font-family:var(--sans); font-size:30px; font-weight:700; letter-spacing:-0.02em; color:var(--text); margin-top:8px; line-height:1; font-variant-numeric:tabular-nums; }
  .kpi .num small { font-size:13px; color:var(--muted); font-weight:500; }
  .kpi .sub { font-size:11.5px; color:var(--muted); margin-top:7px; }
  .kpi .sub.up { color:var(--green); } .kpi .sub.locked { color:var(--teal-deep); }
  .kpi.hl .num { color:var(--teal-deep); }
  .kpi.social .num { color:var(--text); } .kpi.social.locked .num { color:var(--muted); }

  /* skeleton shimmer while first data loads */
  .skl { position:relative; overflow:hidden; border-radius:7px; background:#EEF2F5; }
  .skl::after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(14,27,36,0.05),transparent); background-size:200% 100%; animation:shimmer 1.2s linear infinite; }

  .cols { grid-template-columns:1.4fr 1fr; align-items:start; }
  @media (max-width:900px){ .cols{grid-template-columns:1fr;} }

  /* throughput bars — grow up on entry */
  .bars { display:flex; align-items:flex-end; gap:8px; height:150px; padding-top:8px; }
  .bars .b { flex:1; position:relative; display:flex; align-items:flex-end; height:100%; }
  .bars .bf { width:100%; min-height:3px; position:relative; border-radius:5px 5px 0 0;
    background:linear-gradient(180deg, var(--teal), rgba(21,166,188,0.35));
    animation:growH .8s var(--ease-out) both; animation-delay:calc(var(--i,0)*80ms); }
  .bars .b span { position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:9px; color:var(--muted); }
  .bars .bf b { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:9.5px; font-weight:600; color:var(--teal-deep);
    animation:fadeIn .35s both; animation-delay:calc(var(--i,0)*80ms + .55s); }

  /* channel breakdown — fills sweep in */
  .chan { display:flex; align-items:center; gap:10px; margin-bottom:11px; }
  .chan .nm { width:82px; font-size:12.5px; color:var(--body); text-transform:capitalize; }
  .chan .track { flex:1; height:8px; background:#EEF2F5; border-radius:4px; overflow:hidden; }
  .chan .fill { height:100%; background:var(--teal); border-radius:4px;
    animation:growFillW .8s var(--ease-out) both; animation-delay:calc(var(--i,0)*90ms); }
  .chan .v { width:28px; text-align:right; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }

  /* card header icon */
  .hic { display:inline-flex; width:15px; height:15px; margin-right:8px; color:var(--teal); flex:0 0 auto; }
  .hic svg { width:100%; height:100%; }
  .card h3 .hlab { display:flex; align-items:center; }

  /* top posts: engagement meter per row */
  .tp-meter { height:5px; border-radius:3px; background:#EEF2F5; overflow:hidden; margin-top:7px; }
  .tp-meter i { display:block; height:100%; border-radius:3px; background:var(--teal);
    animation:growFillW .9s var(--ease-out) both; animation-delay:calc(var(--i,0)*90ms); }
  .tp-rank { font-size:13px; font-weight:700; color:var(--teal-deep); width:22px; flex:0 0 auto; }

  .best { display:flex; flex-direction:column; gap:10px; }
  .best .row { display:flex; align-items:center; gap:12px; }
  .best .d { font-size:12px; font-weight:600; letter-spacing:0.02em; color:var(--teal-deep); width:44px; }
  .best .w { display:flex; gap:6px; flex-wrap:wrap; }
  .best .chip { font-size:11px; padding:4px 10px; border:1px solid var(--border); border-radius:20px; color:var(--body); transition:.15s; }
  .best .chip:hover { border-color:var(--border-strong); }
  /* heat tint: primary window highlighted vs the secondary */
  .best .chip.h2 { background:var(--red-soft); border-color:rgba(217,48,27,0.3); color:var(--red); font-weight:600; }
  .best .chip.h1 { background:var(--teal-soft); border-color:rgba(21,166,188,0.3); color:var(--teal-deep); }

  .empty { color:var(--muted); font-size:12.5px; line-height:1.6; padding:16px 4px; animation:fadeIn .5s both; }
  .connect-note { margin-top:12px; font-size:11px; font-weight:600; letter-spacing:0.02em; color:var(--teal-deep); text-transform:uppercase; }

  /* honest per-platform follower breakdown under the Followers KPI — Zernio
     doesn't expose Instagram's follower count today, only Facebook's, so a
     single combined number without this breakdown reads as "wrong" against
     what Arthur sees in the real apps. */
  .acct-chip-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .acct-chip { font-size:10.5px; padding:3px 9px; border-radius:20px; border:1px solid var(--border); color:var(--muted); background:var(--card-2); }
  .acct-chip b { color:var(--text); font-weight:600; }
  .acct-chip.na { color:var(--faint); font-style:italic; }

  /* published posts — every real published post, individually, with its own stats */
  #posts-grid { grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); }
  .post-card { position:relative; border:1px solid var(--border); border-radius:14px; background:var(--card); overflow:hidden; display:flex; flex-direction:column; box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s; }
  .post-card:hover { box-shadow:var(--shadow); transform:translateY(-2px); }
  .post-card .thumb { width:100%; aspect-ratio:1.15/1; background:var(--card-2); object-fit:cover; display:block; }
  .post-card .thumb-empty { width:100%; aspect-ratio:1.15/1; background:var(--card-2); display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:11px; }
  .post-card .body { padding:11px 13px 13px; display:flex; flex-direction:column; gap:7px; flex:1; }
  .post-card .top-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .post-card .top-row .chan-badge { font-size:9.5px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; padding:3px 8px; border-radius:20px; border:1px solid var(--border); color:var(--teal-deep); background:var(--teal-soft); white-space:nowrap; }
  .post-card .top-row .date { font-size:10.5px; color:var(--muted); }
  .post-card .title { font-size:12.5px; color:var(--text); font-weight:600; line-height:1.35; }
  .stat-pill-row { display:flex; flex-wrap:wrap; gap:5px; }
  .stat-pill { font-size:10px; padding:3px 8px; border-radius:20px; background:var(--card-2); border:1px solid var(--border); color:var(--body); }
  .stat-pill b { color:var(--teal-deep); font-weight:600; }
  .pending-note { font-size:10.5px; color:var(--muted); font-weight:500; }
  .permalink-link { font-size:10.5px; color:var(--teal-deep); text-decoration:none; font-weight:600; }
  .permalink-link:hover { text-decoration:underline; }

  /* pipeline board */
  #board { grid-template-columns:repeat(4,1fr); }
  @media (max-width:900px){ #board{grid-template-columns:1fr 1fr;} } @media (max-width:560px){ #board{grid-template-columns:1fr;} }
  .col { border:1px solid var(--border); border-radius:14px; background:var(--card-2); padding:14px; min-height:220px; }
  .col h4 { font-size:11px; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; display:flex; justify-content:space-between; }
  .col h4 .c { color:var(--teal-deep); }
  .pcard { background:var(--card); border:1px solid var(--border); border-radius:11px; padding:12px; margin-bottom:10px; box-shadow:var(--shadow-sm); transition:transform .18s var(--ease-out), box-shadow .18s; }
  .pcard:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
  .pcard .t { font-size:13.5px; color:var(--text); font-weight:600; margin-bottom:7px; line-height:1.35; }
  .pcard .m { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip2 { font-size:9.5px; text-transform:uppercase; letter-spacing:0.03em; font-weight:600; padding:2px 7px; border-radius:5px; border:1px solid var(--border); color:var(--muted); }
  .chip2.ch { color:var(--teal-deep); border-color:rgba(21,166,188,0.3); background:var(--teal-soft); }
  .pcard .a { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
  .mini { font-size:10px; font-weight:600; text-transform:uppercase; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:6px; padding:4px 8px; cursor:pointer; transition:.15s var(--ease-out); }
  .mini:hover { color:var(--teal-deep); border-color:var(--teal); background:var(--teal-soft); }
  .mini:active { transform:scale(.97); }
  .mini.del:hover { color:var(--red); border-color:rgba(217,48,27,0.4); background:var(--red-soft); }

  /* post image thumbs */
  .thumbwrap { position:relative; display:inline-block; line-height:0; border-radius:10px; overflow:hidden; }
  .thumbwrap img { transition:transform .3s var(--ease-out), filter .3s; }
  .thumbwrap:hover img { transform:scale(1.06); filter:brightness(1.04); }
  .playglyph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .playglyph .pg { border-radius:50%; background:rgba(14,27,36,0.55); display:flex; align-items:center; justify-content:center; color:#fff; padding-left:2px; }

  /* calendar */
  .cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cal-nav { display:flex; gap:6px; } .cal-nav button { width:30px; height:30px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal-dow { font-size:10px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); text-align:center; padding:4px 0; }
  .cal-cell { min-height:86px; border:1px solid var(--border); border-radius:9px; padding:6px; background:var(--card); transition:background .15s, border-color .15s; }
  .cal-cell:hover { background:var(--card-2); border-color:var(--border-strong); }
  .cal-cell.other { opacity:0.45; background:var(--card-2); }
  .cal-cell.today { border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal); }
  .cal-date { font-size:10.5px; font-weight:600; color:var(--muted); margin-bottom:4px; }
  .cal-ev { font-size:10px; padding:2px 6px; border-radius:5px; margin-bottom:3px; background:var(--teal-soft); color:var(--teal-deep); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:transform .15s; }
  .cal-ev:hover { transform:translateX(2px); }
  .cal-ev.published { background:rgba(18,183,106,0.12); color:var(--green); }

  /* modal + toast */
  #ov { position:fixed; inset:0; z-index:100; background:rgba(14,27,36,0.42); display:none; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(2px); }
  #ov.open { display:flex; animation:fadeIn .2s both; }
  #modal { width:100%; max-width:520px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:24px; box-shadow:var(--shadow-lg); }
  #ov.open #modal { animation:modalPop .3s var(--ease-pop) both; }
  @keyframes modalPop { from{opacity:0; transform:translateY(12px) scale(.96)} to{opacity:1; transform:none} }
  #modal h3 { font-size:16px; font-weight:700; color:var(--text); margin-bottom:16px; }
  #modal label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin:11px 0 5px; }
  #modal input, #modal select, #modal textarea { width:100%; background:var(--card); border:1px solid var(--border); border-radius:9px; color:var(--text); font-family:var(--sans); font-size:13px; padding:11px; transition:border-color .15s, box-shadow .15s; }
  #modal input:focus, #modal select:focus, #modal textarea:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  #modal textarea { min-height:120px; resize:vertical; } #modal .row{display:flex;gap:10px}#modal .row>div{flex:1}
  #modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  #toast { position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:200; background:var(--text); border:1px solid var(--text); color:#fff; font-size:13px; font-weight:500; padding:12px 20px; border-radius:11px; opacity:0; transition:opacity .25s; pointer-events:none; box-shadow:var(--shadow-lg); }
  #toast.show { opacity:1; animation:toastIn .45s var(--ease-pop) both; }
  @keyframes toastIn { from{opacity:0; transform:translate(-50%,16px)} to{opacity:1; transform:translate(-50%,0)} }

  /* lightbox entry (element re-renders on open, so these replay each time) */
  #lightbox { animation:fadeIn .22s ease both; }
  #lightbox img, #lightbox video { animation:lbPop .3s var(--ease-pop) both; }
  @keyframes lbPop { from{opacity:0; transform:scale(.94)} to{opacity:1; transform:scale(1)} }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="lhs"><span class="badge"></span><div class="ttl">Paulie<br><span>Content Manager</span></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <a class="back" href="/marketing">← Team</a>
        <button class="btn" id="gen-btn">✨ Generate posts</button>
        <button class="btn primary" id="add-btn">+ New content</button>
      </div>
    </header>

    <div id="views">
      <div class="vt active" data-view="overview">Overview</div>
      <div class="vt" data-view="calendar">Calendar</div>
      <div class="vt" data-view="pipeline">Pipeline</div>
      <div class="vt" data-view="approvals">Approvals</div>
    </div>

    <!-- OVERVIEW -->
    <section class="view active" id="view-overview">
      <div class="grid" id="kpis" style="margin-bottom:16px"></div>
      <div class="grid cols" style="margin-bottom:16px">
        <div class="card"><h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-8M22 19H2"/></svg></i>Publish Throughput</span> <span style="color:var(--muted);font-weight:400;letter-spacing:0">last 8 weeks</span></h3><div class="bars" id="bars"></div></div>
        <div class="card"><h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 4"/></svg></i>By Channel</span></h3><div id="chan"></div></div>
      </div>
      <div class="grid cols">
        <div class="card"><h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.2 4.1 1 5.9L12 16.4 6.7 19.2l1-5.9L3.5 9.2l5.9-.9z"/></svg></i>Top Posts</span></h3><div id="topposts"></div></div>
        <div class="card"><h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg></i>Best Time to Post</span></h3><div class="best" id="best"></div></div>
      </div>
      <div class="card" style="margin-top:16px">
        <h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></i>Published Posts</span> <span id="posts-count" style="color:var(--muted);font-weight:400;letter-spacing:0"></span></h3>
        <div class="grid" id="posts-grid"></div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="view-calendar">
      <div class="card">
        <div class="cal-head"><h3 style="margin:0" id="cal-title">—</h3>
          <div class="cal-nav"><button class="btn" id="cal-prev">‹</button><button class="btn" id="cal-next">›</button></div></div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>
    </section>

    <!-- PIPELINE -->
    <section class="view" id="view-pipeline">
      <div class="grid" id="board"></div>
    </section>

    <!-- APPROVALS -->
    <section class="view" id="view-approvals">
      <div class="card"><h3><span class="hlab"><i class="hic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></i>Awaiting Approval</span></h3><div id="approvals"></div></div>
    </section>
  </div>

  <div id="ov"><div id="modal">
    <h3 id="modal-title">New content</h3>
    <input type="hidden" id="m-id" />
    <label>Title</label><input id="m-title" type="text" placeholder="e.g. 5 signs your pool needs a remodel" />
    <div class="row"><div><label>Channel</label><select id="m-channel"></select></div><div><label>Status</label><select id="m-status"></select></div></div>
    <label>Schedule for (optional)</label><input id="m-date" type="date" />
    <label>Caption / draft</label><textarea id="m-body" placeholder="Outline, caption, or full draft…"></textarea>
    <div class="actions"><button class="btn" id="m-cancel">Cancel</button><button class="btn primary" id="m-save">Save</button></div>
  </div></div>
  <div id="toast"></div>

<script>
(function(){
  "use strict";
  var CH=[], ST=[], A=null, items=[], calRef=new Date();
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c];});}
  function toast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2400);}
  function fmtNum(n){ if(n==null)return"—"; n=Number(n); return n>=1000?(n/1000).toFixed(1)+"k":String(n); }
  function labelFor(c){ return {blog:"Blog",instagram:"Instagram",facebook:"Facebook",linkedin:"LinkedIn",gbp:"Google Business",email:"Email"}[c]||c; }

  // ── motion helpers ─────────────────────────────────────────────────────────
  var RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Stagger-reveal a container's children (rise + fade, step ms apart).
  function reveal(target,step){
    if(RM)return;
    var el=typeof target==="string"?document.querySelector(target):target;
    if(!el)return;
    Array.prototype.forEach.call(el.children,function(c,i){
      c.style.opacity="0";
      c.style.animation="rise .5s "+(i*(step==null?45:step))+"ms cubic-bezier(.22,.9,.3,1) both";
    });
  }
  // Count KPI numbers up from 0 (skipped under reduced motion).
  function cuFmt(v,target){ target=target==null?v:target;
    if(target>=1000) return fmtNum(Math.round(v));
    if(Math.round(target)!==target) return (Math.round(v*10)/10).toFixed(1);
    return String(Math.round(v)); }
  function countUps(){
    document.querySelectorAll(".cuv[data-cu]").forEach(function(el){
      var t=parseFloat(el.getAttribute("data-cu"));
      if(!isFinite(t)){return;}
      if(RM||t===0){ el.textContent=cuFmt(t); return; }
      var t0=null;
      function frame(ts){ if(!t0)t0=ts; var p=Math.min(1,(ts-t0)/700); var e=1-Math.pow(1-p,3);
        el.textContent=cuFmt(t*e,t); if(p<1)requestAnimationFrame(frame); }
      requestAnimationFrame(frame);
    });
  }
  // Skeleton shimmer so the first paint isn't a blank page.
  function skeleton(){
    var k=""; for(var i=0;i<10;i++) k+='<div class="kpi"><div class="skl" style="width:46%;height:9px"></div><div class="skl" style="width:60%;height:26px;margin-top:12px"></div></div>';
    document.getElementById("kpis").innerHTML=k;
    ["bars","chan","topposts","best"].forEach(function(id){
      var el=document.getElementById(id); if(el) el.innerHTML='<div class="skl" style="width:100%;height:'+(id==="bars"?"120px":"84px")+'"></div>';
    });
  }
  function acctSub(s){ var a=(s&&s.accounts)||[]; return a.length?a.map(function(x){return labelFor(x.platform);}).join(" + "):"connected"; }

  // view switching
  function showView(key){
    document.querySelectorAll(".vt").forEach(function(x){x.classList.toggle("active",x.getAttribute("data-view")===key);});
    document.querySelectorAll(".view").forEach(function(x){x.classList.toggle("active",x.id==="view-"+key);});
    if(key==="calendar") renderCalendar();
  }
  document.getElementById("views").addEventListener("click",function(e){
    var v=e.target.closest(".vt"); if(!v)return;
    showView(v.getAttribute("data-view"));
  });

  function load(){
    return Promise.all([
      fetch("/api/ralph/status").then(function(r){return r.json();}),
      fetch("/api/ralph/analytics").then(function(r){return r.json();}),
      fetch("/api/ralph/content").then(function(r){return r.json();})
    ]).then(function(res){
      var status=res[0]; A=res[1]; items=res[2].items||[];
      CH=status.channels; ST=status.statuses;
      document.getElementById("m-channel").innerHTML=CH.map(function(c){return '<option value="'+c+'">'+labelFor(c)+'</option>';}).join("");
      document.getElementById("m-status").innerHTML=ST.filter(function(x){return x!=="archived";}).map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join("");
      // live draft count on the Approvals tab
      var drafts=items.filter(function(i){return i.status==="draft";}).length;
      var at=document.querySelector('.vt[data-view="approvals"]');
      if(at) at.innerHTML="Approvals"+(drafts?' <span class="tabct">'+drafts+'</span>':"");
      renderOverview(); renderBoard(); renderApprovals();
    });
  }

  // Numeric values render as count-up targets; strings ("—") render as-is.
  function kpi(cls,lab,num,suffix,sub,subcls){
    var val=(typeof num==="number"&&isFinite(num))
      ? '<span class="cuv" data-cu="'+num+'">0</span>'
      : esc(String(num));
    return '<div class="kpi '+(cls||"")+'"><div class="lab">'+lab+'</div><div class="num">'+val+(suffix?'<small>'+suffix+'</small>':'')+'</div>'+(sub?'<div class="sub '+(subcls||"")+'">'+sub+'</div>':'')+'</div>';
  }
  // Honest per-platform breakdown under the Followers KPI. Zernio doesn't
  // expose Instagram's follower count today (only Facebook's real fan_count),
  // so a single combined number reads as "wrong" against what Arthur sees in
  // the real apps unless each platform's real (or unavailable) count is shown.
  function followerBreakdown(s){
    var accts=(s&&s.accounts)||[];
    if(!accts.length) return acctSub(s);
    return '<div class="acct-chip-row">'+accts.map(function(a){
      var lab=labelFor(a.platform==="instagram"?"instagram":a.platform);
      if(a.followers==null) return '<span class="acct-chip na">'+esc(lab)+': not available via Zernio</span>';
      return '<span class="acct-chip">'+esc(lab)+': <b>'+fmtNum(a.followers)+'</b></span>';
    }).join("")+'</div>';
  }
  function renderOverview(){
    var k=A.kpis||{}, s=A.social||{};
    var social = s.connected;
    document.getElementById("kpis").innerHTML =
      kpi("social"+(social?"":" locked"),"Followers", (social&&s.followers!=null)?Number(s.followers):"—", "", social?followerBreakdown(s):"Connect accounts", social?"up":"locked")+
      kpi("social"+(social?"":" locked"),"Engagement Rate", (social&&s.engagementRate!=null)?Number(s.engagementRate):"—", (social&&s.engagementRate!=null)?"%":"", social?"avg / post":"—")+
      kpi("social"+(social?"":" locked"),"Reach", (social&&s.reach!=null)?Number(s.reach):"—","", social?"tracked":"—")+
      kpi("social"+(social?"":" locked"),"Impressions", (social&&s.impressions!=null)?Number(s.impressions):"—","", social?"tracked":"—")+
      kpi("social"+(social?"":" locked"),"Likes", (social&&s.likes!=null)?Number(s.likes):"—","", social?"total":"—")+
      kpi("social"+(social?"":" locked"),"Comments", (social&&s.comments!=null)?Number(s.comments):"—","", social?"total":"—")+
      kpi("hl","Published", Number(k.published||0),"", (k.publishedThisMonth||0)+" this month","up")+
      kpi("hl","Scheduled", Number(k.scheduledAhead||0),"", "queued ahead")+
      kpi("","Ideas", Number(k.ideas||0),"", "in backlog")+
      kpi("","Avg / Week", Number(k.avgPerWeek||0),"", "publish rate");
    countUps();
    reveal("#kpis",40);

    // throughput bars (bf grows up, staggered by --i)
    var t=A.throughput||[]; var max=Math.max(1,Math.max.apply(null,t.map(function(x){return x.c;}).concat([1])));
    document.getElementById("bars").innerHTML = t.length ? t.map(function(x,bi){
      var h=Math.round((x.c/max)*130)+3; var wk=(x.wk||"").split("-")[1]||"";
      return '<div class="b" style="--i:'+bi+'"><div class="bf" style="height:'+h+'px"><b>'+x.c+'</b></div><span>W'+wk+'</span></div>';
    }).join("") : '<div class="empty">No published content yet — publish from the pipeline and the trend fills in.</div>';

    // channel breakdown (fill sweeps in, staggered)
    var bc=A.byChannel||[]; var cmax=Math.max(1,Math.max.apply(null,bc.map(function(x){return x.c;}).concat([1])));
    document.getElementById("chan").innerHTML = bc.length ? bc.map(function(x,ci){
      return '<div class="chan"><div class="nm">'+esc(labelFor(x.channel))+'</div><div class="track"><div class="fill" style="width:'+Math.round((x.c/cmax)*100)+'%;--i:'+ci+'"></div></div><div class="v">'+x.c+'</div></div>';
    }).join("") : '<div class="empty">Nothing published yet.</div>';

    // top posts — REAL from Zernio when connected, ranked with engagement meters
    var tp=A.topPosts||[];
    var erMax=Math.max.apply(null,tp.map(function(p){return Number(p.engagementRate)||0;}).concat([1]));
    document.getElementById("topposts").innerHTML = tp.length ? tp.map(function(p,pi){
      var txt=esc((p.content||"(no caption)").slice(0,90));
      var meta='♥ '+fmtNum(p.likes||0)+' · 💬 '+fmtNum(p.comments||0)+(p.reach?' · reach '+fmtNum(p.reach):"")+(p.engagementRate?' · '+p.engagementRate+'%':"");
      var head='<span class="chip2 ch">'+esc(labelFor(p.platform))+'</span> ';
      var pct=Math.max(6,Math.round(((Number(p.engagementRate)||0)/erMax)*100));
      var body='<div class="row" style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)">'+
        '<span class="tp-rank">'+String(pi+1).padStart(2,"0")+'</span>'+
        '<div style="flex:1;min-width:0">'+head+
        (p.url?'<a href="'+esc(p.url)+'" target="_blank" rel="noopener" style="color:var(--text)">'+txt+'</a>':txt)+
        '<div style="color:var(--muted);font-size:12px;margin-top:3px">'+meta+'</div>'+
        '<div class="tp-meter"><i style="width:'+pct+'%;--i:'+pi+'"></i></div>'+
        '</div></div>';
      return body;
    }).join("") :
      '<div class="empty">'+(social?'Metrics are syncing — best-performing posts will rank here shortly.':'Your best-performing posts (by engagement) will rank here.<div class="connect-note">● Connect social accounts to unlock</div>')+'</div>';

    // best times — primary window burns hotter than the secondary
    document.getElementById("best").innerHTML = (A.bestTimes||[]).map(function(b){
      return '<div class="row"><div class="d">'+b.day+'</div><div class="w">'+b.windows.map(function(w,wi){return '<span class="chip '+(wi===0?"h2":"h1")+'">'+w+'</span>';}).join("")+'</div></div>';
    }).join("") + '<div class="connect-note" style="margin-top:6px">General guidance · refines with your data</div>';
    reveal("#topposts",55); reveal("#best",55);

    renderPublishedPosts();
  }

  // Every published post individually, not just the top 5 performers. Each
  // post's real stats come from Zernio matched by its live URL (external_url,
  // set automatically at publish time) — three honest states:
  //   not_connected  — no social account connected yet
  //   pending_sync   — connected, but Zernio hasn't returned analytics for
  //                    this specific post yet (e.g. it's very recent)
  //   synced         — real likes/comments/reach/impressions shown
  function renderPublishedPosts(){
    var posts=A.posts||[];
    var el=document.getElementById("posts-grid");
    document.getElementById("posts-count").textContent = posts.length ? ("· "+posts.length) : "";
    if(!posts.length){
      el.innerHTML='<div class="empty">Nothing published yet — approve and publish from the pipeline, and each post will show up here individually with its own stats.</div>';
      return;
    }
    el.innerHTML=posts.map(function(p,pi){
      var thumb=p.imageUrl?'<img class="thumb" loading="lazy" src="'+esc(p.imageUrl)+'" alt="">':'<div class="thumb-empty">No image</div>';
      var date=p.publishedAt?esc((p.publishedAt||"").split("T")[0].split(" ")[0]):"—";
      var statsBlock;
      if(p.statsStatus==="synced"&&p.stats){
        var st=p.stats, pills=[];
        pills.push('<span class="stat-pill">♥ <b>'+fmtNum(st.likes)+'</b></span>');
        pills.push('<span class="stat-pill">💬 <b>'+fmtNum(st.comments)+'</b></span>');
        if(st.shares) pills.push('<span class="stat-pill">↻ <b>'+fmtNum(st.shares)+'</b></span>');
        if(st.saved) pills.push('<span class="stat-pill">⚑ <b>'+fmtNum(st.saved)+'</b></span>');
        if(st.reach) pills.push('<span class="stat-pill">Reach <b>'+fmtNum(st.reach)+'</b></span>');
        statsBlock='<div class="stat-pill-row">'+pills.join("")+'</div>'
          +(p.permalink?'<a class="permalink-link" href="'+esc(p.permalink)+'" target="_blank" rel="noopener">View live post →</a>':'');
      } else if(p.statsStatus==="pending_sync"){
        statsBlock='<div class="pending-note">Stats syncing from Zernio…</div>'
          +(p.permalink?'<a class="permalink-link" href="'+esc(p.permalink)+'" target="_blank" rel="noopener">View live post →</a>':'');
      } else {
        statsBlock='<div class="pending-note">Connect social accounts to see real stats</div>';
      }
      return '<div class="post-card">'+thumb
        +'<div class="body">'
        +'<div class="top-row"><span class="chan-badge">'+esc(labelFor(p.channel))+'</span><span class="date">'+date+'</span></div>'
        +'<div class="title">'+esc(p.title)+'</div>'
        +statsBlock
        +'</div></div>';
    }).join("");
    reveal("#posts-grid",30);
  }

  function renderBoard(){
    var cols=[["idea","Ideas"],["draft","Drafts"],["scheduled","Scheduled"],["published","Published"]];
    document.getElementById("board").innerHTML=cols.map(function(col){
      var list=items.filter(function(i){return i.status===col[0];});
      var cards=list.length?list.map(pcard).join(""):'<div class="empty">Empty.</div>';
      return '<div class="col"><h4>'+col[1]+' <span class="c">'+list.length+'</span></h4>'+cards+'</div>';
    }).join("");
    document.querySelectorAll("#board .col").forEach(function(col){ reveal(col,35); });
    bind();
  }
  function pcard(i){
    var next={idea:"draft",draft:"scheduled",scheduled:"published"}[i.status];
    var date=i.scheduled_for?('· '+esc((i.scheduled_for||"").split("T")[0])):"";
    var canPub=(i.status==="scheduled"||i.status==="draft")&&(i.channel==="instagram"||i.channel==="facebook")&&(i.format!=="reel"||!!i.video_url);
    return '<div class="pcard"><div class="t">'+esc(i.title)+'</div>'+
      '<div class="m"><span class="chip2" style="color:#cdb4ff">'+fmtBadge(i.format)+'</span><span class="chip2 ch">'+esc(labelFor(i.channel))+'</span><span class="chip2">'+esc(i.status)+'</span>'+(date?'<span class="chip2">'+date+'</span>':'')+'</div>'+
      (i.external_url?'<div class="m"><a href="'+esc(i.external_url)+'" target="_blank" rel="noopener" style="color:#7cd7ff;font-size:12px">↗ view live post</a></div>':'')+
      '<div class="a">'+
      (canPub?'<button class="mini pub" data-id="'+i.id+'" style="color:#7cd7ff;border-color:rgba(124,215,255,0.45)">🚀 publish</button>':(next?'<button class="mini adv" data-id="'+i.id+'" data-to="'+next+'">→ '+next+'</button>':''))+
      '<button class="mini edit" data-id="'+i.id+'">edit</button><button class="mini del" data-id="'+i.id+'">del</button></div></div>';
  }
  function fmtBadge(f){ var m={reel:"🎬 Reel",carousel:"🎠 Carousel",before_after:"🔄 Before / After",offer:"🎯 Offer",single:"🖼 Post"}; return m[f||"single"]||"🖼 Post"; }
  function imgStrip(i,size){
    var urls=(i.image_urls&&i.image_urls.length)?i.image_urls:(i.image_url?[i.image_url]:[]);
    if(!urls.length)return "";
    var s=size||120;
    var isReel=(i.format==="reel");
    var gallery=esc(urls.join("|"));
    var auto=isReel?"1":"0";
    var title=isReel?"Click to play the reel preview":"Click to view full screen";
    var video=isReel?(i.video_url||""):"";
    var cells=urls.slice(0,4).map(function(u,idx){
      var img='<img class="zoomable" data-gallery="'+gallery+'" data-idx="'+idx+'" data-autoplay="'+auto+'" data-video="'+esc(video)+'" src="'+esc(u)+'" alt="" loading="lazy" title="'+title+'" style="width:'+s+'px;height:'+s+'px;object-fit:cover;background:rgba(255,255,255,0.04);cursor:'+(isReel?'pointer':'zoom-in')+'">';
      // Reel thumbs get a pulsing ▶ glyph so it's obvious they play. The overlay
      // is click-through (pointer-events:none) so the image still gets the click.
      var play=(isReel&&idx===0)?'<span class="playglyph"><span class="pg" style="width:'+Math.round(s*0.34)+'px;height:'+Math.round(s*0.34)+'px;font-size:'+Math.round(s*0.16)+'px">▶</span></span>':'';
      return '<span class="thumbwrap">'+img+play+'</span>';
    }).join("");
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto">'+cells+(urls.length>4?'<span class="chip2">+'+(urls.length-4)+'</span>':'')+'</div>';
  }
  function renderApprovals(){
    var pend=items.filter(function(i){return i.status==="draft";});
    document.getElementById("approvals").innerHTML = pend.length ? pend.map(function(i){
      var img=imgStrip(i,120);
      var cap=i.body?'<div style="white-space:pre-wrap;color:var(--muted);font-size:13px;line-height:1.5;margin-top:6px;max-height:220px;overflow:auto">'+esc(i.body)+'</div>':'';
      var altBlock=i.alt_body?('<div style="margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">'+
        '<div style="font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em">✍ ALT CAPTION OPTION</div>'+
        '<div style="white-space:pre-wrap;color:var(--muted);font-size:12px;line-height:1.45;max-height:140px;overflow:auto;opacity:.85">'+esc(i.alt_body)+'</div>'+
        '<button class="mini swapcap" data-id="'+i.id+'" style="margin-top:6px">⇄ Use this caption</button></div>'):'';
      var isReel=(i.format==="reel");
      var canPub=(i.channel==="instagram"||i.channel==="facebook")&&(!isReel||!!i.video_url);
      var err=i.publish_error?'<div style="color:var(--red,#ff8c8c);font-size:12px;margin-top:6px">⚠ '+esc(i.publish_error)+'</div>':'';
      var pubBtn=canPub?'<button class="mini pub" data-id="'+i.id+'" style="color:#7cd7ff;border-color:rgba(124,215,255,0.45)">🚀 Publish now</button>':'';
      var reelNote=(isReel&&!i.video_url)?'<span class="chip2" style="color:#ffcf8c">rendering video…</span>':'';
      return '<div class="pcard" style="margin-bottom:10px">'+
        '<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">'+img+
        '<div style="flex:1;min-width:260px"><div class="t">'+esc(i.title)+'</div>'+
        '<div class="m"><span class="chip2" style="color:#cdb4ff">'+fmtBadge(i.format)+'</span><span class="chip2 ch">'+esc(labelFor(i.channel))+'</span>'+(canPub?'<span class="chip2">publishes automatically</span>':reelNote)+'</div>'+cap+altBlock+err+'</div></div>'+
        '<div class="a" style="margin-top:10px">'+pubBtn+
        '<button class="mini adv" data-id="'+i.id+'" data-to="scheduled" style="color:var(--green);border-color:rgba(124,255,176,0.4)">Move to Scheduled</button>'+
        '<button class="mini edit" data-id="'+i.id+'">edit</button><button class="mini del" data-id="'+i.id+'">reject</button></div></div>';
    }).join("") : '<div class="empty">Nothing in the queue right now. Hit <b>✨ Generate posts</b> — Paulie drafts reels, carousels & posts, and publishes them automatically (usually within a few hours). Reject anything here first, or hit Publish now to skip the wait.</div>';
    reveal("#approvals",60);
    bind();
  }
  function bind(){
    document.querySelectorAll(".mini.adv").forEach(function(b){b.onclick=function(){patch(b.getAttribute("data-id"),{status:b.getAttribute("data-to")});};});
    document.querySelectorAll(".mini.del").forEach(function(b){b.onclick=function(){if(confirm("Remove this?"))fetch("/api/ralph/content/"+b.getAttribute("data-id")+"/delete",{method:"POST"}).then(load);};});
    document.querySelectorAll(".mini.edit").forEach(function(b){b.onclick=function(){openEdit(b.getAttribute("data-id"));};});
    document.querySelectorAll(".mini.pub").forEach(function(b){b.onclick=function(){publish(b);};});
    document.querySelectorAll(".mini.swapcap").forEach(function(b){b.onclick=function(){fetch("/api/ralph/content/"+b.getAttribute("data-id")+"/swap-caption",{method:"POST"}).then(function(){toast("Caption swapped");load();});};});
  }
  function publish(b){
    var id=b.getAttribute("data-id");
    if(!confirm("Publish this post live to the real account now?"))return;
    b.disabled=true; var o=b.textContent; b.textContent="🚀 Publishing…";
    fetch("/api/ralph/content/"+id+"/publish",{method:"POST"}).then(function(r){return r.json();}).then(function(d){
      if(d&&d.ok){ toast("Published live"+(d.url?" — opening":"")); if(d.url)window.open(d.url,"_blank","noopener"); load(); }
      else { toast((d&&d.error)||"Publish failed"); b.disabled=false; b.textContent=o; load(); }
    }).catch(function(){toast("Publish failed");b.disabled=false;b.textContent=o;});
  }
  function patch(id,body){fetch("/api/ralph/content/"+id,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(d){toast(d&&d.scheduled_for?("✓ Scheduled for "+String(d.scheduled_for).split("T")[0]):"Updated");load();}).catch(function(){toast("Updated");load();});}

  function renderCalendar(){
    var y=calRef.getFullYear(),m=calRef.getMonth();
    document.getElementById("cal-title").textContent=calRef.toLocaleDateString("en-US",{month:"long",year:"numeric"});
    var byDate={}; items.forEach(function(i){ var d=(i.scheduled_for||i.published_at||"").split("T")[0].split(" ")[0]; if(d)(byDate[d]=byDate[d]||[]).push(i); });
    var first=new Date(y,m,1), startDow=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
    var today=new Date().toISOString().slice(0,10);
    var cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(function(d){return '<div class="cal-dow">'+d+'</div>';}).join("");
    for(var i=startDow-1;i>=0;i--) cells+='<div class="cal-cell other"><div class="cal-date">'+(prev-i)+'</div></div>';
    for(var day=1;day<=days;day++){
      var ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
      var evs=(byDate[ds]||[]).map(function(e){return '<div class="cal-ev '+(e.status==="published"?"published":"")+'">'+esc(e.title)+'</div>';}).join("");
      cells+='<div class="cal-cell'+(ds===today?" today":"")+'"><div class="cal-date">'+day+'</div>'+evs+'</div>';
    }
    document.getElementById("cal-grid").innerHTML=cells;
    reveal("#cal-grid",7);
  }
  document.getElementById("cal-prev").onclick=function(){calRef.setMonth(calRef.getMonth()-1);renderCalendar();};
  document.getElementById("cal-next").onclick=function(){calRef.setMonth(calRef.getMonth()+1);renderCalendar();};

  // modal
  var ov=document.getElementById("ov");
  function openNew(){document.getElementById("modal-title").textContent="New content";["m-id","m-title","m-date","m-body"].forEach(function(x){document.getElementById(x).value="";});document.getElementById("m-status").value="idea";ov.classList.add("open");}
  function openEdit(id){var i=items.find(function(x){return String(x.id)===String(id);});if(!i)return;
    document.getElementById("modal-title").textContent="Edit content";document.getElementById("m-id").value=i.id;
    document.getElementById("m-title").value=i.title||"";document.getElementById("m-channel").value=i.channel||"blog";
    document.getElementById("m-status").value=i.status||"idea";document.getElementById("m-date").value=(i.scheduled_for||"").split("T")[0];
    document.getElementById("m-body").value=i.body||"";ov.classList.add("open");}
  document.getElementById("add-btn").onclick=openNew;
  var genBtn=document.getElementById("gen-btn");
  genBtn.onclick=function(){
    if(genBtn.disabled)return;
    genBtn.disabled=true; var orig=genBtn.textContent;
    genBtn.textContent="✨ Generating…"; genBtn.classList.add("working");
    toast("Paulie is building reels, full carousels & before/afters with imagery — this can take several minutes…");
    fetch("/api/ralph/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({count:5})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){ toast("Paulie drafted "+d.created+" post"+(d.created===1?"":"s")+" → Approvals"); showView("approvals"); load(); }
        else { toast((d&&d.error)||"Generation failed"); }
      })
      .catch(function(){toast("Generation failed");})
      .finally(function(){genBtn.disabled=false; genBtn.textContent=orig; genBtn.classList.remove("working");});
  };
  document.getElementById("m-cancel").onclick=function(){ov.classList.remove("open");};
  document.getElementById("m-save").onclick=function(){
    var id=document.getElementById("m-id").value;
    var p={title:document.getElementById("m-title").value.trim(),channel:document.getElementById("m-channel").value,status:document.getElementById("m-status").value,scheduled_for:document.getElementById("m-date").value||null,body:document.getElementById("m-body").value};
    if(!p.title){toast("Title required");return;}
    fetch(id?("/api/ralph/content/"+id):"/api/ralph/content",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)}).then(function(){ov.classList.remove("open");toast("Saved");load();});
  };

  // ── Fullscreen image lightbox + reel player ────────────────────────────────
  // Click any post image → full screen. Carousels/before-afters are a manual
  // gallery (← →). REELS auto-PLAY: the frames step on a timer like an IG story
  // (segmented progress bar up top), loop, and tap the image to pause/resume.
  var FRAME_MS=2200;
  var lb=document.createElement("div");
  lb.id="lightbox";
  lb.style.cssText="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.93);align-items:center;justify-content:center;flex-direction:column";
  lb.innerHTML='<div id="lb-bars" style="position:fixed;top:14px;left:50%;transform:translateX(-50%);display:none;gap:5px;width:min(520px,86vw)"></div>'+
    '<img id="lb-img" src="" alt="" style="max-width:94vw;max-height:88vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 60px rgba(0,0,0,0.7);cursor:pointer">'+
    '<video id="lb-video" playsinline loop controls autoplay style="display:none;max-width:94vw;max-height:90vh;border-radius:12px;box-shadow:0 10px 60px rgba(0,0,0,0.7);background:#000"></video>'+
    '<div id="lb-hint" style="position:fixed;bottom:46px;left:50%;transform:translateX(-50%);color:#aaa;font-size:12px;font-family:monospace;display:none">▶ playing — tap image to pause · ← → to step</div>'+
    '<button id="lb-close" style="position:fixed;top:16px;right:20px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer;line-height:1;z-index:2">&times;</button>'+
    '<button id="lb-prev" style="position:fixed;left:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:26px;cursor:pointer;border-radius:10px;padding:8px 14px;z-index:2">&#8249;</button>'+
    '<button id="lb-next" style="position:fixed;right:14px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:26px;cursor:pointer;border-radius:10px;padding:8px 14px;z-index:2">&#8250;</button>'+
    '<div id="lb-count" style="position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:#ccc;font-size:13px;font-family:monospace"></div>';
  document.body.appendChild(lb);
  var lbUrls=[],lbIdx=0,lbAuto=false,lbPaused=false,lbTimer=null;
  var lbImg=document.getElementById("lb-img"),lbBars=document.getElementById("lb-bars"),lbHint=document.getElementById("lb-hint"),lbVideo=document.getElementById("lb-video");
  function lbBuildBars(){
    if(!lbAuto){ lbBars.style.display="none"; return; }
    lbBars.style.display="flex";
    var h="";
    for(var k=0;k<lbUrls.length;k++){h+='<div style="flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,0.28);overflow:hidden"><div class="lb-fill" data-k="'+k+'" style="height:100%;width:0;background:#fff"></div></div>';}
    lbBars.innerHTML=h;
  }
  function lbPaintBars(animate){
    if(!lbAuto)return;
    lbBars.querySelectorAll(".lb-fill").forEach(function(f){
      var k=parseInt(f.getAttribute("data-k"),10);
      if(k<lbIdx){f.style.transition="none";f.style.width="100%";}
      else if(k>lbIdx){f.style.transition="none";f.style.width="0";}
      else{ // current
        f.style.transition="none";f.style.width="0";
        if(animate&&!lbPaused){ void f.offsetWidth; f.style.transition="width "+FRAME_MS+"ms linear"; f.style.width="100%"; }
      }
    });
  }
  function lbClear(){ if(lbTimer){clearTimeout(lbTimer);lbTimer=null;} }
  function lbSchedule(){ lbClear(); if(lbAuto&&!lbPaused){ lbTimer=setTimeout(function(){ lbIdx=(lbIdx+1)%lbUrls.length; lbShow(true); }, FRAME_MS); } }
  function lbShow(animate){
    lbImg.src=lbUrls[lbIdx]||"";
    // soft crossfade between story frames (skip under reduced motion)
    if(lbAuto&&animate&&!RM){ lbImg.style.animation="none"; void lbImg.offsetWidth; lbImg.style.animation="fadeIn .3s ease both"; }
    document.getElementById("lb-count").textContent=lbUrls.length>1?((lbIdx+1)+" / "+lbUrls.length):"";
    var multi=lbUrls.length>1?"":"none";
    document.getElementById("lb-prev").style.display=multi;
    document.getElementById("lb-next").style.display=multi;
    lbPaintBars(animate);
    lbSchedule();
    lb.style.display="flex";
  }
  function lbOpen(t){
    var video=t.getAttribute("data-video");
    // A reel with a rendered MP4 → play the ACTUAL video, not the frame animatic.
    if(video){
      lbClear(); lbAuto=false;
      lbImg.style.display="none"; lbBars.style.display="none"; lbHint.style.display="none";
      lbVideo.style.display="block"; lbVideo.src=video; try{lbVideo.currentTime=0;lbVideo.play();}catch(_){}
      document.getElementById("lb-count").textContent="";
      document.getElementById("lb-prev").style.display="none";
      document.getElementById("lb-next").style.display="none";
      lb.style.display="flex";
      return;
    }
    lbVideo.style.display="none"; lbVideo.pause(); lbVideo.removeAttribute("src"); lbImg.style.display="block";
    lbUrls=(t.getAttribute("data-gallery")||t.src).split("|").filter(Boolean);
    lbIdx=parseInt(t.getAttribute("data-idx")||"0",10)||0;
    lbAuto=(t.getAttribute("data-autoplay")==="1")&&lbUrls.length>1;
    lbPaused=false;
    if(lbAuto)lbIdx=0; // reels always play from the first frame
    lbHint.style.display=lbAuto?"block":"none";
    lbBuildBars();
    lbShow(true);
  }
  function lbClose(){ lbClear(); try{lbVideo.pause();lbVideo.removeAttribute("src");}catch(_){} lbVideo.style.display="none"; lb.style.display="none"; lbUrls=[]; lbAuto=false; }
  function lbStep(d){ if(!lbUrls.length)return; lbPaused=true; lbHint.textContent="⏸ paused — tap image to resume · ← → to step"; lbIdx=(lbIdx+d+lbUrls.length)%lbUrls.length; lbShow(false); }
  function lbTogglePause(){ if(!lbAuto)return; lbPaused=!lbPaused; lbHint.textContent=(lbPaused?"⏸ paused":"▶ playing")+" — tap image to "+(lbPaused?"resume":"pause")+" · ← → to step"; lbShow(!lbPaused); }
  document.addEventListener("click",function(e){
    var t=e.target;
    if(t&&t.classList&&t.classList.contains("zoomable")){ lbOpen(t); e.preventDefault(); e.stopPropagation(); return; }
    if(lb.style.display!=="flex")return;
    if(t&&t.id==="lb-prev"){ lbStep(-1); e.stopPropagation(); return; }
    if(t&&t.id==="lb-next"){ lbStep(1); e.stopPropagation(); return; }
    if(t&&t.id==="lb-video"){ e.stopPropagation(); return; } // let native controls work
    if(t&&t.id==="lb-img"){ if(lbAuto){ lbTogglePause(); } else { lbClose(); } e.stopPropagation(); return; }
    lbClose(); // click backdrop / ✕ closes
  },true);
  document.addEventListener("keydown",function(e){
    if(lb.style.display!=="flex")return;
    if(e.key==="Escape")lbClose();
    else if(e.key==="ArrowLeft")lbStep(-1);
    else if(e.key==="ArrowRight")lbStep(1);
    else if(e.key===" "){ lbTogglePause(); e.preventDefault(); }
  });

  skeleton();
  load();
})();
</script>
</body>
</html>
