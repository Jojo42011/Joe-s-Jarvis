<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Totally Outdoors OS · Phones</title>
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/signal.css" />
<script src="/theme-sync.js"></script>
<style>
  /* Screen-specific styling only — every colour, radius and shadow below is a
     signal.css token, so this page follows the shell's light/dark theme. */
  html { -webkit-text-size-adjust: 100%; }
  body {
    overflow-x: hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: env(safe-area-inset-bottom);
  }
  #app { max-width: 1100px; margin: 0 auto; padding: 0 22px 64px; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

  /* ── Top bar ─────────────────────────────────────────────────────────── */
  #topbar {
    display: flex; align-items: center; justify-content: space-between;
    height: 60px; border-bottom: 1px solid var(--divider); margin-bottom: 26px;
  }
  .back {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600;
    color: var(--ink-3); text-decoration: none; transition: color .15s var(--ease);
    min-height: 44px; padding: 8px 0;
    -webkit-tap-highlight-color: transparent;
  }
  .back:hover { color: var(--brand); }
  #clock { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); }

  /* ── Page head ───────────────────────────────────────────────────────── */
  #hero { margin-bottom: 22px; display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
  #hero .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--brand); margin-bottom: 8px; }
  #hero h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  #hero p { margin-top: 4px; color: var(--muted); font-size: 13.5px; max-width: 62ch; }

  /* Connection chip — same shape as .pill, but JS rewrites className so it
     can't inherit the component class. */
  .conn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600;
    padding: 5px 11px; border-radius: var(--r-pill);
    border: 1px solid var(--border-strong); background: var(--panel); color: var(--muted);
    white-space: nowrap;
  }
  .conn .led { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .conn.live { color: var(--green); background: var(--green-bg); border-color: transparent; }
  .conn.live .led { background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); animation: blink 2s ease-in-out infinite; }
  .conn.off { color: var(--money); background: var(--money-bg); border-color: transparent; }
  .conn.off .led { background: var(--money); box-shadow: 0 0 0 3px var(--money-bg); }
  @keyframes blink { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

  /* ── Stats: signal .kpis / .kpi ──────────────────────────────────────── */
  #stats { margin-bottom: 26px; }
  .kpi .n.brand { color: var(--brand); }

  .section-label {
    display: flex; align-items: center; gap: 12px;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--ink-3); margin-bottom: 12px;
  }
  .section-label::after { content: ""; flex: 1; height: 1px; background: var(--divider); }

  /* ── Call list ───────────────────────────────────────────────────────── */
  .call-list {
    border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden;
    background: var(--panel); box-shadow: var(--sh-rest);
  }
  .call-row { border-bottom: 1px solid var(--divider); cursor: pointer; transition: background .15s var(--ease); -webkit-tap-highlight-color: transparent; }
  .call-row:last-child { border-bottom: none; }
  .call-row:hover, .call-row.open, .call-row:active { background: var(--panel-alt); }

  .call-header { display: flex; flex-direction: column; gap: 9px; padding: 13px 18px; min-height: 44px; }
  .ch-primary { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ch-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .ch-tags .meta { font-size: 12.5px; color: var(--muted); }
  .ch-tags .cost-cell { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--money); margin-left: auto; }

  .call-header .num { font-weight: 600; font-size: 13.5px; word-break: break-all; }
  .call-header .cname { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chevron { color: var(--faint); transition: transform .2s var(--ease); font-size: 13px; text-align: center; flex-shrink: 0; padding-top: 2px; min-width: 28px; min-height: 28px; display: flex; align-items: center; justify-content: center; }
  .call-row.open .chevron { transform: rotate(180deg); color: var(--brand); }

  /* .pill base comes from signal.css; these are the call-specific meanings.
     green = a live/connected phone line, indigo = system-reported state,
     money-red = the call never landed. */
  .pill.in { background: var(--green-bg); color: var(--green); }
  .pill.out { background: var(--indigo-bg); color: var(--indigo); }
  .pill.miss { background: var(--money-bg); color: var(--money); }
  .pill.booked { background: var(--green-bg); color: var(--green); border-color: var(--green); }

  /* ── Expanded detail ─────────────────────────────────────────────────── */
  .call-detail { display: none; padding: 0 18px 20px; border-top: 1px solid var(--divider); }
  .call-row.open .call-detail { display: block; }

  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
  .detail-grid > * { min-width: 0; }
  @media (max-width: 700px) { .detail-grid { grid-template-columns: 1fr; } }

  .detail-card { border: 1px solid var(--border); border-radius: var(--r-btn); padding: 15px; background: var(--panel-alt); }
  .detail-card.full { grid-column: 1 / -1; }
  .detail-card h3 {
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 11px;
  }
  .detail-card audio { width: 100%; height: 38px; border-radius: 6px; outline: none; }
  .no-recording { color: var(--faint); font-size: 12px; }

  .summary-text { color: var(--ink-2); font-size: 13.5px; line-height: 1.6; }

  /* Cost table — reset signal's global table chrome; this is a compact ledger. */
  .cost-table { width: 100%; }
  .cost-table td { padding: 5px 0; font-size: 13px; border-bottom: none; }
  .cost-table tr:hover td { background: transparent; }
  .cost-table td:first-child { color: var(--muted); text-transform: capitalize; }
  .cost-table td:last-child { text-align: right; font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .cost-total td { border-top: 1px solid var(--divider); padding-top: 8px; font-weight: 700; }
  .cost-total td:last-child { color: var(--money); }

  /* ── Transcript ──────────────────────────────────────────────────────── */
  .transcript-wrap { max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .msg { padding: 10px 13px; border-radius: var(--r-btn); font-size: 13px; line-height: 1.55; max-width: 88%; }
  .msg.bot { background: var(--indigo-bg); border: 1px solid transparent; color: var(--ink); align-self: flex-start; }
  .msg.user { background: var(--fill); border: 1px solid var(--border); color: var(--ink); align-self: flex-end; }
  .msg .role-tag { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .msg.bot .role-tag { color: var(--indigo); }
  .msg.user .role-tag { color: var(--green); }
  .transcript-raw { white-space: pre-wrap; color: var(--ink-2); font-size: 13px; line-height: 1.6; max-height: 400px; overflow-y: auto; }

  .meta-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .meta-item { font-size: 12px; color: var(--muted); }
  .meta-item span { color: var(--ink); font-weight: 600; }

  /* ── Empty / honest states (extends signal .empty) ───────────────────── */
  .empty .big { font-weight: 600; color: var(--ink-2); font-size: 14px; margin-bottom: 4px; }
  .empty .small { margin-top: 6px; color: var(--faint); font-size: 12.5px; line-height: 1.5; max-width: 52ch; margin-left: auto; margin-right: auto; }
  .empty code { font-family: var(--mono); color: var(--ink); background: var(--fill); padding: 2px 7px; border-radius: 5px; font-size: 12px; }

  .call-list-head { display: none; }

  @media (max-width: 640px) {
    #app { padding: 0 max(16px, env(safe-area-inset-left)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right)); }
    #topbar { height: auto; min-height: 52px; padding: 10px 0; margin-bottom: 20px; }
    #hero { flex-direction: column; gap: 12px; margin-bottom: 18px; }
    #hero h1 { font-size: 20px; }
    #stats { margin-bottom: 22px; }
    .call-header { padding: 13px 14px; }
    .call-detail { padding: 0 14px 16px; }
    .detail-card { padding: 13px; }
    .detail-card audio { height: 44px; }
    .meta-row { gap: 10px 16px; }
    .meta-item { font-size: 11.5px; flex: 1 1 45%; }
    .msg { max-width: 95%; font-size: 13.5px; padding: 11px 13px; }
    .transcript-wrap { max-height: 320px; }
  }

  @media (max-width: 380px) {
    .ch-tags .cost-cell { margin-left: 0; width: 100%; margin-top: 4px; }
  }
</style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <a class="back" href="/">&larr; Totally Outdoors OS</a>
      <span id="clock">--:--:--</span>
    </header>

    <section id="hero">
      <div>
        <div class="eyebrow">Phone line &middot; Call receptionist</div>
        <h1>Phones</h1>
        <p>All-time inbound &amp; outbound call history — every call since day one, updated live as calls come in.</p>
      </div>
      <div class="conn" id="conn"><span class="led"></span><span id="conn-text">Checking…</span></div>
    </section>

    <div id="stats" class="kpis">
      <div class="kpi"><div class="n" id="s-total">--</div><div class="l">Total Calls</div></div>
      <div class="kpi"><div class="n green" id="s-connected">--</div><div class="l">Connected</div></div>
      <div class="kpi"><div class="n" id="s-avg">--</div><div class="l">Avg Duration</div></div>
      <div class="kpi"><div class="n brand" id="s-booked">--</div><div class="l">Booked</div></div>
      <div class="kpi"><div class="n money" id="s-cost">--</div><div class="l">Total Cost</div></div>
    </div>

    <div class="section-label">Recent Calls</div>
    <div class="call-list" id="call-list">
      <div id="rows">
        <div class="empty"><div class="big">Loading…</div></div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    "use strict";
    var clockEl = document.getElementById("clock");
    function tick() {
      var d = new Date(), p = function(n) { return String(n).padStart(2, "0"); };
      clockEl.textContent = p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }
    tick(); setInterval(tick, 1000);

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function(c) {
        return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
      });
    }
    function fmtDur(sec) {
      sec = Number(sec || 0);
      if (!sec) return "\u2014";
      var m = Math.floor(sec / 60), s = sec % 60;
      return m + "m " + String(s).padStart(2, "0") + "s";
    }
    function fmtTime(s) {
      if (!s) return "\u2014";
      var d = new Date(s);
      if (isNaN(d)) return esc(s);
      return d.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }
    function fmtCost(n) {
      if (!n && n !== 0) return "\u2014";
      return "$" + Number(n).toFixed(2);
    }
    function fmtCost4(n) {
      if (!n && n !== 0) return "$0.00";
      return "$" + Number(n).toFixed(4);
    }
    function setConn(state, text) {
      var el = document.getElementById("conn");
      el.className = "conn " + state;
      document.getElementById("conn-text").textContent = text;
    }

    function notConnected(reason) {
      setConn("off", "Vapi Not Connected");
      ["s-total", "s-connected", "s-avg", "s-booked", "s-cost"].forEach(function(id) {
        document.getElementById(id).textContent = "\u2014";
      });
      document.getElementById("rows").innerHTML =
        '<div class="empty">'
        + '<div class="big">Awaiting Vapi Connection</div>'
        + '<div class="small">Add <code>VAPI_API_KEY</code> to start streaming call metrics.'
        + (reason ? '<br>' + esc(reason) : '') + '</div>'
        + '</div>';
    }

    function buildTranscript(c) {
      if (c.messages && c.messages.length) {
        var visible = c.messages.filter(function(m) {
          var role = (m.role || "").toLowerCase();
          return role !== "system" && role !== "tool" && role !== "function";
        });
        if (!visible.length) return '<div class="no-recording">No transcript available</div>';
        return '<div class="transcript-wrap">' + visible.map(function(m) {
          var role = (m.role || "").toLowerCase();
          var isBot = role === "bot" || role === "assistant";
          var cls = isBot ? "bot" : "user";
          var label = isBot ? "Receptionist" : "Caller";
          return '<div class="msg ' + cls + '"><div class="role-tag">' + esc(label) + '</div>' + esc(m.text) + '</div>';
        }).join("") + '</div>';
      }
      if (c.transcript) {
        return '<div class="transcript-raw">' + esc(c.transcript) + '</div>';
      }
      return '<div class="no-recording">No transcript available</div>';
    }

    function buildRecording(c) {
      if (c.recordingUrl && typeof c.recordingUrl === "string") {
        // Placeholder only — the real <audio> is injected the first time the row
        // is expanded. Rendering audio for every row made the browser preload
        // hundreds of recordings at once through the server proxy, which
        // flooded the VM's sockets and starved the Vapi sync itself.
        var proxied = "/api/calls/recording?url=" + encodeURIComponent(c.recordingUrl);
        return '<div class="rec-slot" data-src="' + esc(proxied) + '"><span class="no-recording">Expand to load recording</span></div>';
      }
      return '<div class="no-recording">No recording available</div>';
    }

    // Called when a row toggles open: swap the placeholder for a live player.
    function hydrateRecording(row) {
      var slot = row.querySelector(".rec-slot");
      if (!slot || slot.querySelector("audio")) return;
      var a = document.createElement("audio");
      a.controls = true;
      a.preload = "metadata";
      a.src = slot.getAttribute("data-src");
      slot.innerHTML = "";
      slot.appendChild(a);
    }
    window.__toggleCallRow = function (headerEl) {
      var row = headerEl.parentElement;
      row.classList.toggle("open");
      if (row.classList.contains("open")) hydrateRecording(row);
    };

    function buildCostBreakdown(c) {
      if (!c.costBreakdown || !Object.keys(c.costBreakdown).length) {
        return '<div class="money-txt" style="font-size:19px;color:var(--money)">' + fmtCost(c.cost) + '</div>'
          + '<div style="margin-top:6px;font-size:12px;color:var(--faint)">No breakdown available</div>';
      }
      var html = '<table class="cost-table">';
      var entries = Object.entries(c.costBreakdown).filter(function(e) { return e[0] !== "total"; });
      entries.forEach(function(e) {
        html += '<tr><td>' + esc(e[0]) + '</td><td>' + fmtCost4(e[1]) + '</td></tr>';
      });
      html += '<tr class="cost-total"><td>Total</td><td>' + fmtCost(c.cost) + '</td></tr></table>';
      return html;
    }

    function buildCallRow(c) {
      var dirPill = c.direction === "inbound" ? '<span class="pill in">Inbound</span>'
        : c.direction === "outbound" ? '<span class="pill out">Outbound</span>'
        : '<span class="pill miss">\u2014</span>';
      var LIVE_STATES = { "in-progress": 1, "ringing": 1, "queued": 1, "forwarding": 1 };
      var outcome = c.booked ? '<span class="pill booked">Booked</span>'
        : c.connected ? '<span class="pill out">Connected</span>'
        : LIVE_STATES[(c.endedReason || "").toLowerCase()] ? '<span class="pill in">In Progress</span>'
        : '<span class="pill miss">' + esc(c.endedReason || "Missed") + '</span>';

      var nameHtml = c.customerName ? '<div class="cname">' + esc(c.customerName) + '</div>' : '';

      var headerHtml = '<div class="call-header" onclick="window.__toggleCallRow(this)">'
        + '<div class="ch-primary">'
        + '<div><div class="num">' + esc(c.number) + '</div>' + nameHtml + '</div>'
        + '<div class="chevron">&#9660;</div>'
        + '</div>'
        + '<div class="ch-tags">'
        + dirPill + ' ' + outcome
        + '<span class="meta">' + fmtDur(c.durationSec) + '</span>'
        + '<span class="cost-cell">' + fmtCost(c.cost) + '</span>'
        + '</div>'
        + '</div>';

      var detailHtml = '<div class="call-detail">'
        + '<div class="meta-row">'
        + '<div class="meta-item">Time: <span>' + fmtTime(c.startedAt) + '</span></div>'
        + '<div class="meta-item">Duration: <span>' + fmtDur(c.durationSec) + '</span></div>'
        + '<div class="meta-item">Ended: <span>' + esc(c.endedReason) + '</span></div>'
        + '<div class="meta-item">Cost: <span>' + fmtCost(c.cost) + '</span></div>'
        + '</div>'
        + '<div class="detail-grid">'
        + '<div class="detail-card"><h3>Recording</h3>' + buildRecording(c) + '</div>'
        + '<div class="detail-card"><h3>Cost Breakdown</h3>' + buildCostBreakdown(c) + '</div>'
        + (c.summary ? '<div class="detail-card full"><h3>Summary</h3><div class="summary-text">' + esc(c.summary) + '</div></div>' : '')
        + '<div class="detail-card full"><h3>Transcript</h3>' + buildTranscript(c) + '</div>'
        + '</div>'
        + '</div>';

      return '<div class="call-row">' + headerHtml + detailHtml + '</div>';
    }

    async function load() {
      try {
        var res = await fetch("/api/calls");
        var data = await res.json();
        if (!data.connected) { notConnected(data.reason); return; }

        // Show real sync freshness, not just "key exists". Stale = the server
        // hasn't managed a successful Vapi sync in over 10 minutes.
        var age = data.syncAgeSec;
        if (age == null) {
          setConn("live", "Vapi Live");
        } else if (age > 600) {
          setConn("off", "Sync Stale · " + Math.round(age / 60) + "m ago");
        } else {
          setConn("live", "Vapi Live · synced " + (age < 90 ? "just now" : Math.round(age / 60) + "m ago"));
        }
        var stats = data.stats || {};
        document.getElementById("s-total").textContent = Number(stats.total || 0);
        document.getElementById("s-connected").textContent = Number(stats.connected || 0);
        document.getElementById("s-avg").textContent = fmtDur(stats.avgDurationSec);
        document.getElementById("s-booked").textContent = Number(stats.booked || 0);
        document.getElementById("s-cost").textContent = fmtCost(stats.totalCost);

        var calls = data.calls || [];
        var rowsEl = document.getElementById("rows");
        if (!calls.length) {
          rowsEl.innerHTML = '<div class="empty"><div class="big">No calls yet</div><div class="small">The phone line is standing by.</div></div>';
          return;
        }

        // Never rebuild the list while a recording is mid-playback — replacing the
        // <audio> element would interrupt it (this was the "recording gets stuck" bug).
        var playing = false;
        rowsEl.querySelectorAll("audio").forEach(function(a) {
          if (!a.paused && !a.ended && a.currentTime > 0) playing = true;
        });
        if (playing) return; // stats already updated above; refresh rows next cycle

        var openIds = {};
        rowsEl.querySelectorAll(".call-row.open").forEach(function(el) {
          var id = el.getAttribute("data-id");
          if (id) openIds[id] = true;
        });

        rowsEl.innerHTML = calls.map(function(c) {
          return buildCallRow(c);
        }).join("");

        rowsEl.querySelectorAll(".call-row").forEach(function(el, i) {
          var id = calls[i] && calls[i].id;
          if (id) {
            el.setAttribute("data-id", id);
            if (openIds[id]) { el.classList.add("open"); hydrateRecording(el); }
          }
        });
      } catch (e) {
        notConnected("Failed to load metrics");
      }
    }
    load();
    var shellActive = true;
    window.addEventListener("message", function(e){
      var d = e.data || {};
      if (d.type === "shell-visibility") { var was = shellActive; shellActive = !!d.active; if (shellActive && !was) load(); }
    });
    setInterval(function(){ if (shellActive) load(); }, 8000);
  })();
  </script>
</body>
</html>
