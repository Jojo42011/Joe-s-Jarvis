<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Totally Outdoors OS — Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    /* Totally Outdoors brand */
    --red:#C81A10; --red-hover:#A01109; --red-soft:rgba(200,26,16,0.09);
    /* Silver accent (was teal) — chrome to match the Totally Outdoors badge */
    --teal:#AEB4BF; --teal-deep:#7F8792; --teal-soft:rgba(174,180,191,0.16);
    --navy:#0E1B24; --navy-2:#152A35; --navy-3:#1C3542;
    --app-bg:#F4F7F9;
    --text:#0E1B24; --muted:#6B7C86; --green:#12B76A;
    /* sidebar-scoped text */
    --side-text:#E7EEF2; --side-muted:#8CA0AB; --side-line:rgba(255,255,255,0.07);
    --w:248px;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; background:var(--app-bg); color:var(--text); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  #shell { display:flex; height:100vh; width:100vw; }

  /* ── Sidebar: dark navy rail ── */
  #side {
    position:relative; flex:0 0 var(--w); width:var(--w);
    background:var(--navy);
    border-right:1px solid rgba(0,0,0,0.06);
    display:flex; flex-direction:column; z-index:20;
    transition:margin-left .3s cubic-bezier(.4,0,.2,1), opacity .25s;
  }
  #shell.collapsed #side { margin-left:calc(-1 * var(--w)); opacity:0; }

  #side-head { display:flex; align-items:center; justify-content:space-between; padding:22px 16px 16px 20px; }
  #brand { display:flex; align-items:center; min-width:0; }
  #brand img { height:30px; width:auto; max-width:158px; display:block; }
  #collapse { width:30px; height:30px; border-radius:8px; border:1px solid var(--side-line); background:transparent; color:var(--side-muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s; }
  #collapse:hover { background:rgba(255,255,255,0.06); color:#fff; }

  #nav { flex:1; overflow-y:auto; padding:6px 12px; }
  #nav::-webkit-scrollbar { width:0; }
  .nav-sep { font-size:10px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--side-muted); padding:16px 12px 8px; }
  .nav-item { position:relative; display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer; margin-bottom:2px; border:1px solid transparent; transition:background .15s, color .15s; }
  .nav-item:hover { background:rgba(255,255,255,0.05); }
  .nav-item.active { background:var(--teal-soft); }
  .nav-item.active::before { content:""; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:0 3px 3px 0; background:var(--teal); }
  .nav-item .ic { flex:0 0 auto; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; border:1px solid var(--side-line); color:var(--side-muted); background:rgba(255,255,255,0.02); transition:.15s; }
  .nav-item .ic svg { width:17px; height:17px; }
  .nav-item:hover .ic { color:var(--side-text); }
  .nav-item.active .ic { background:var(--teal); border-color:var(--teal); color:#1a1d22; }
  .nav-item .tx .l { font-size:13.5px; font-weight:600; color:var(--side-text); letter-spacing:.1px; }
  .nav-item .tx .s { font-size:11px; color:var(--side-muted); margin-top:1px; }
  .nav-item.active .tx .l { color:#fff; }
  .nav-item.home { margin-bottom:6px; }
  #side-foot { padding:14px 20px; border-top:1px solid var(--side-line); font-size:10px; font-weight:600; letter-spacing:0.1em; color:var(--side-muted); text-transform:uppercase; display:flex; align-items:center; gap:8px; }
  .live-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(18,183,106,0.18); }

  /* ── Floating reopen (when collapsed) ── */
  #reopen { position:fixed; top:16px; left:16px; z-index:60; display:none; align-items:center; gap:9px; padding:8px 14px 8px 8px; border-radius:40px; background:var(--navy); border:1px solid rgba(255,255,255,0.1); cursor:pointer; box-shadow:0 8px 24px rgba(14,27,36,0.25); transition:transform .15s; }
  #reopen:hover { transform:scale(1.03); }
  #shell.collapsed #reopen { display:flex; }
  #reopen .orb { width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 34% 30%, #eef1f5, var(--teal-deep) 78%); }
  #reopen .rl { font-size:11px; font-weight:600; letter-spacing:0.12em; color:#fff; text-transform:uppercase; }

  /* ── Main ── */
  #main { flex:1; position:relative; min-width:0; }
  .frame { position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; pointer-events:none; transition:opacity .18s; background:var(--app-bg); }
  .frame.active { opacity:1; pointer-events:auto; }

  #toast { position:absolute; top:18px; left:50%; transform:translateX(-50%) translateY(-24px); z-index:70; background:#fff; border:1px solid #E5EBEF; color:var(--text); font-size:13px; padding:11px 18px; border-radius:11px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none; box-shadow:0 12px 30px rgba(14,27,36,0.14); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast b { color:var(--red); }

  @media (max-width:780px){
    :root { --w:216px; }
    #shell.collapsed #side { margin-left:calc(-1 * var(--w)); }
  }
</style>
</head>
<body>
  <div id="shell">
    <aside id="side">
      <div id="side-head">
        <div id="brand"><img src="/assets/totally-outdoors-logo.png" alt="Totally Outdoors LLC" /></div>
        <button id="collapse" title="Collapse (⌘\)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      </div>
      <nav id="nav"></nav>
      <div id="side-foot"><span class="live-dot"></span>Jarvis online · secure</div>
    </aside>

    <div id="reopen"><span class="orb"></span><span class="rl">Menu</span></div>

    <div id="main">
      <div id="frames"></div>
      <div id="toast"></div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var ICON = {
    arlo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.4"/><path d="M12 1.5v2.2M12 20.3v2.2M1.5 12h2.2M20.3 12h2.2"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.9 8.9 0 0 1-3.2-.6L3 21l1.8-5.2a8 8 0 0 1-1.3-4.3A8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3z"/></svg>',
    seo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
    content:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
    crm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/><circle cx="9" cy="9" r="1"/><circle cx="15" cy="9" r="1"/></svg>',
    calls:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>',
    inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5h18v13H3z"/><path d="M3 6l9 6 9-6"/></svg>',
    memory:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="12" r="2.4"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="17" r="2"/><path d="M6.7 7.1l3.6 3.6M17.4 8.3l-3.7 2.9M10.5 13.4L7.3 16.6M13.7 13.2l3.1 2.6"/></svg>',
    integrations:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5l-3 3M9.5 8.5l6 6M20.5 9.5l-3 3M8.5 14.5l-5 5"/></svg>',
    team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
  };
  var TABS = [
    { key:"arlo", label:"Jarvis", sub:"Operator", src:"/arlo", home:true },
    { key:"calls", label:"Calls", sub:"Sofia", src:"/calls" },
    { key:"chat", label:"Text", sub:"Message Jarvis", src:"/chat" },
    { key:"inbox", label:"Email", sub:"Inbox", src:"/inbox" },
    { key:"memory", label:"Memory", sub:"Neural Map", src:"/memory" },
    { key:"integrations", label:"Integrations", sub:"Hands", src:"/integrations" }
  ];
  var byKey = {}; TABS.forEach(function(t){ byKey[t.key]=t; });
  var current = "arlo";
  var nav = document.getElementById("nav"), frames = document.getElementById("frames");
  var toastEl = document.getElementById("toast");
  var shell = document.getElementById("shell");

  nav.innerHTML = TABS.map(function(t,i){
    var sep = (i===2) ? '<div class="nav-sep">Agents &amp; Views</div>' : '';
    return sep + '<div class="nav-item'+(t.home?' home':'')+(t.key===current?' active':'')+'" data-key="'+t.key+'" title="'+t.label+'">'+
      '<div class="ic">'+(ICON[t.key]||"")+'</div><div class="tx"><div class="l">'+t.label+'</div><div class="s">'+t.sub+'</div></div></div>';
  }).join("");

  frames.innerHTML = TABS.map(function(t){
    var src = t.key==="arlo" ? ' src="'+t.src+'"' : '';
    return '<iframe class="frame'+(t.key===current?' active':'')+'" id="frame-'+t.key+'" data-src="'+t.src+'"'+src+' allow="microphone; autoplay; camera"></iframe>';
  }).join("");

  function toast(msg){ toastEl.innerHTML = msg; toastEl.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ toastEl.classList.remove("show"); },3000); }

  function activate(key, viaArlo){
    if(!byKey[key]) return;
    var f = document.getElementById("frame-"+key);
    if(f && !f.src) f.src = f.getAttribute("data-src");
    TABS.forEach(function(t){
      document.getElementById("frame-"+t.key).classList.toggle("active", t.key===key);
      var ni = nav.querySelector('.nav-item[data-key="'+t.key+'"]'); if(ni) ni.classList.toggle("active", t.key===key);
    });
    current = key;
    // Tell each tab whether it's visible so background dashboards pause polling
    // (frees the CPU for Jarvis). Jarvis's tab is event-driven and ignores this.
    TABS.forEach(function(t){
      var fr = document.getElementById("frame-"+t.key);
      if (fr && fr.contentWindow) { try { fr.contentWindow.postMessage({ type:"shell-visibility", active: t.key===key }, "*"); } catch(_){} }
    });
    if(viaArlo && key!=="arlo") toast('<b>Jarvis</b> pulled up '+byKey[key].label+' — reading it over');
  }

  // Collapse → current tab goes full-screen
  function setCollapsed(v){
    shell.classList.toggle("collapsed", v);
    try { localStorage.setItem("aq_collapsed", v ? "1" : "0"); } catch(_){}
  }
  document.getElementById("collapse").onclick = function(){ setCollapsed(true); };
  document.getElementById("reopen").onclick = function(){ setCollapsed(false); };
  document.addEventListener("keydown", function(e){ if((e.metaKey||e.ctrlKey) && e.key==="\\"){ e.preventDefault(); setCollapsed(!shell.classList.contains("collapsed")); } });
  try { if(localStorage.getItem("aq_collapsed")==="1") shell.classList.add("collapsed"); } catch(_){}

  nav.addEventListener("click", function(e){ var it=e.target.closest(".nav-item"); if(it) activate(it.getAttribute("data-key")); });
  window.addEventListener("message", function(e){ var d=e.data||{}; if(d.type==="arlo-navigate" && d.tab){ activate(String(d.tab).toLowerCase(), true); } });
  var q = new URLSearchParams(location.search).get("tab"); if(q && byKey[q]) activate(q);
})();
</script>
</body>
</html>
