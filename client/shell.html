<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Totally Outdoors · Operating System</title>
<link rel="icon" href="/assets/totally-outdoors-logo.png" />
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/signal.css" />
<script src="/theme-sync.js"></script>
<style>
  html, body { height:100%; overflow:hidden; }

  #shell { display:flex; height:100vh; width:100%; }

  /* ── Sidebar ───────────────────────────────────────────────────────── */
  #side {
    width:var(--sidebar); flex:0 0 var(--sidebar);
    background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
    transition:width .18s var(--ease), flex-basis .18s var(--ease);
  }
  #shell.collapsed #side { width:64px; flex-basis:64px; }
  #shell.collapsed .lbl, #shell.collapsed .grp-t, #shell.collapsed .sub,
  #shell.collapsed #brand-text, #shell.collapsed .nav-item .badge { display:none; }
  #shell.collapsed .nav-item { justify-content:center; padding:9px 0; }

  #brand {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; border-bottom:1px solid var(--divider); flex:0 0 auto;
  }
  #brand img { width:34px; height:34px; object-fit:contain; flex:0 0 auto; }
  #brand-text .n { font-size:13.5px; font-weight:700; letter-spacing:-.01em; line-height:1.2; }
  #brand-text .s { font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }

  #nav { flex:1 1 auto; overflow-y:auto; padding:10px 10px 16px; min-height:0; }
  .grp-t {
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.09em;
    color:var(--faint); padding:14px 8px 6px;
  }
  .nav-item {
    display:flex; align-items:center; gap:10px;
    padding:8px 10px; border-radius:var(--r-btn); cursor:pointer;
    color:var(--ink-2); font-size:13.5px; font-weight:600;
    margin-bottom:1px; border:1px solid transparent; user-select:none;
  }
  .nav-item:hover { background:var(--fill); color:var(--ink); }
  .nav-item.on { background:var(--brand-bg); color:var(--brand); }
  .nav-item .ic { width:18px; height:18px; flex:0 0 auto; opacity:.9; }
  .nav-item .ic svg { width:18px; height:18px; display:block; }
  .nav-item .lbl { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #side-foot { flex:0 0 auto; border-top:1px solid var(--divider); padding:9px 10px; display:flex; gap:6px; align-items:center; }
  #side-foot .btn { flex:1 1 auto; }

  /* ── Main ──────────────────────────────────────────────────────────── */
  #main { flex:1 1 auto; display:flex; flex-direction:column; min-width:0; min-height:0; }
  #top {
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:0 18px; height:56px; background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  #top .t { font-size:15px; font-weight:700; letter-spacing:-.01em; }
  #top .sub { font-size:12.5px; color:var(--muted); }
  /* Always present — the nav must be reachable from the top bar at every width,
     including full screen with the sidebar collapsed. */
  #hamb { display:inline-flex; align-items:center; gap:7px; margin-right:12px; }
  #frames { flex:1 1 auto; position:relative; min-height:0; background:var(--bg); }
  .frame { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
  .frame.on { display:block; }

  /* ── Command palette (⌘K) ──────────────────────────────────────────── */
  #scrim { position:fixed; inset:0; background:rgba(10,13,24,.42); z-index:80; display:none; }
  #scrim.on { display:block; }
  .palette {
    position:fixed; top:14vh; left:50%; transform:translateX(-50%);
    width:min(560px,92vw); z-index:90; display:none;
    background:var(--panel); border:1px solid var(--border-strong);
    border-radius:14px; box-shadow:var(--sh-lift); overflow:hidden;
  }
  .palette.on { display:block; }
  .palette input { border:0; border-bottom:1px solid var(--divider); border-radius:0; padding:15px 17px; font-size:15px; }
  .palette input:focus { outline:none; border-color:var(--divider); }
  #pal-list { max-height:min(52vh,420px); overflow-y:auto; padding:6px; }
  .pal-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:9px; cursor:pointer; font-size:13.5px; }
  .pal-item .sub { font-size:12px; color:var(--muted); }
  .pal-item.sel, .pal-item:hover { background:var(--fill); }
  .pal-item .ic svg { width:17px; height:17px; display:block; opacity:.75; }

  /* ── Mobile: the outer document scrolls; iframes are sized to content ─ */
  @media (max-width:900px) {
    html, body { overflow:auto; height:auto; }
    #shell { display:block; height:auto; }
    #side {
      position:fixed; inset:0 auto 0 0; z-index:70; width:270px; flex-basis:270px;
      transform:translateX(-100%); transition:transform .2s var(--ease);
      box-shadow:var(--sh-lift);
    }
    #shell.drawer #side { transform:none; }
    #main { min-height:100vh; }
    #top { position:sticky; top:0; z-index:40; }
    #hamb span { display:none; }  /* icon only once space is tight */
    #frames { position:static; min-height:60vh; }
    .frame { position:static; height:auto; min-height:70vh; }
  }
</style>
</head>
<body>
<div id="shell">
  <aside id="side">
    <div id="brand">
      <img src="/assets/totally-outdoors-logo.png" alt="Totally Outdoors LLC" />
      <div id="brand-text">
        <div class="n">Totally Outdoors</div>
        <div class="s">Operating System</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="side-foot">
      <button class="btn btn-sm btn-ghost" id="theme-btn" title="Toggle light / dark">🌗<span class="lbl"> Theme</span></button>
      <button class="btn btn-sm btn-ghost" id="collapse-btn" title="Collapse sidebar (Ctrl + \)">⇔</button>
    </div>
  </aside>

  <main id="main">
    <header id="top">
      <button class="btn btn-sm btn-ghost" id="hamb" title="Show / hide the menu">☰ <span>Menu</span></button>
      <div class="grow">
        <div class="t" id="top-title">Home</div>
        <div class="sub" id="top-sub">Everything in one place</div>
      </div>
      <button class="btn btn-sm btn-ghost" id="pal-btn" title="Search (⌘K)">⌘K</button>
    </header>
    <div id="frames"></div>
  </main>
</div>

<div id="scrim"></div>
<div class="palette" id="palette">
  <input type="search" id="pal-input" placeholder="Jump to a screen, or search leads and calls…" autocomplete="off" spellcheck="false" />
  <div id="pal-list"></div>
</div>

<script>
(function () {
  "use strict";

  var I = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9 17.5 20 6.5"/></svg>',
    sweep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h7"/></svg>',
    orb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><circle cx="12" cy="12" r="8.4"/><path d="M12 1.6v2.2M12 20.2v2.2M1.6 12h2.2M20.2 12h2.2"/></svg>',
    chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.3 8.9 8.9 0 0 1-3.2-.6L3 21l1.8-5.2a8 8 0 0 1-1.3-4.3A8.4 8.4 0 0 1 12 3.2a8.4 8.4 0 0 1 9 8.3z"/></svg>',
    phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.7 2z"/></svg>',
    crm:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-6 9 6v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>',
    funnel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8.5V20l-4 1.5v-9z"/></svg>',
    msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
    money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>',
    spend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6.5c0-2-2.2-3-5-3s-5 .9-5 2.9c0 4.6 10 2.3 10 6.9 0 2.1-2.2 3.2-5 3.2s-5-1.1-5-3.1"/></svg>',
    truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.5 8.5 12 13l8.5-4.5M12 13v9"/></svg>',
    plug:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 3.5l-3 3M9.5 8.5l6 6M20.5 9.5l-3 3M8.5 14.5l-5 5"/></svg>',
    brain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="12" cy="12" r="2.4"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="17" r="2"/><path d="M6.7 7.1l3.6 3.6M17.4 8.3l-3.7 2.9M10.5 13.4 7.3 16.6M13.7 13.2l3.1 2.6"/></svg>',
    team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="3.6"/><path d="M22 21v-2a4 4 0 0 0-3-3.8"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
  };

  // Every entry here must resolve to a real screen — a nav item pointing at a
  // page that does not exist is a bug (spec §1).
  var SCREENS = {
    home:     { src:'/dashboard',    title:'Home',             sub:'Everything in one place', icon:I.home, home:true },
    approve:  { src:'/approvals',    title:'To approve',       sub:'Nothing leaves the building without you', icon:I.check },
    sweep:    { src:'/sweep',        title:'What you missed',  sub:'Every call, lead and email — and what nobody acted on', icon:I.sweep },
    jarvis:   { src:'/jarvis',       title:'Ask Jarvis',       sub:'One conversation over the whole business', icon:I.orb },
    chat:     { src:'/chat',         title:'Chat',             sub:'Text Jarvis', icon:I.chat },
    phones:   { src:'/calls',        title:'Phones',           sub:'Sofia answers every call, 24/7', icon:I.phone },
    crm:      { src:'/crm',          title:'CRM',              sub:'The control panel and every lead record', icon:I.crm },
    pipeline: { src:'/pipeline',     title:'Pipeline',         sub:'Weighted forecast, stage by stage', icon:I.funnel },
    leads:    { src:'/leads',        title:'Leads',            sub:'Message anyone — text, email, Messenger or Instagram', icon:I.msg },
    inbox:    { src:'/inbox',        title:'Inbox',            sub:'Every mailbox, triaged', icon:I.mail },
    money:    { src:'/money',        title:'Getting paid',     sub:'What is owed and what has landed', icon:I.money },
    materials:{ src:'/materials',    title:'Materials',        sub:'Purchase orders and suppliers', icon:I.truck },
    spend:    { src:'/spend',        title:'Wasted spend',     sub:'What the business pays for, and what it returns', icon:I.spend },
    sync:     { src:'/integrations', title:'Integrations',     sub:'Every hand the team can reach', icon:I.plug },
    memory:   { src:'/memory',       title:'Memory',           sub:'What Jarvis knows, and how it connects', icon:I.brain },
    team:     { src:'/team',         title:'Access',           sub:'Who can sign in, and what they can see', icon:I.team },
    hire:     { src:'/hire',         title:'Hire a new agent', sub:'Describe the gap in your own words', icon:I.plus }
  };

  var GROUPS = [
    { title:null,           keys:['home','approve','sweep','jarvis','chat'] },
    { title:'Workstreams',  keys:['phones'] },
    // Pipeline lives inside the CRM screen now; money/materials/spend stay
    // routable (palette, voice, deep links, dashboard buttons) but off the nav.
    { title:'Customers',    keys:['crm','leads','inbox'] },
    { title:'Your team',    keys:['sync','memory','team','hire'] }
  ];

  var shell = document.getElementById('shell');
  var navEl = document.getElementById('nav');
  var framesEl = document.getElementById('frames');
  var titleEl = document.getElementById('top-title');
  var subEl = document.getElementById('top-sub');
  var current = null;
  var frames = {};

  /* ── Build nav ─────────────────────────────────────────────────────── */
  GROUPS.forEach(function (g) {
    if (g.title) {
      var t = document.createElement('div');
      t.className = 'grp-t'; t.textContent = g.title;
      navEl.appendChild(t);
    }
    g.keys.forEach(function (key) {
      var s = SCREENS[key]; if (!s) return;
      var el = document.createElement('div');
      el.className = 'nav-item'; el.dataset.key = key; el.title = s.title;
      el.innerHTML = '<span class="ic">' + s.icon + '</span><span class="lbl">' + s.title + '</span>';
      el.addEventListener('click', function () { activate(key); closeDrawer(); });
      navEl.appendChild(el);
    });
  });

  /* ── Frames: home eager, everything else lazy on first activation ──── */
  function frameFor(key) {
    if (frames[key]) return frames[key];
    var s = SCREENS[key];
    var f = document.createElement('iframe');
    f.className = 'frame'; f.dataset.key = key;
    f.setAttribute('title', s.title);
    f.setAttribute('allow', 'microphone; camera; clipboard-write');
    f.src = s.src;
    framesEl.appendChild(f);
    frames[key] = f;
    f.addEventListener('load', function () {
      pushTheme(f);
      if (isMobile()) sizeFrame(f);
    });
    return f;
  }

  function activate(key) {
    if (!SCREENS[key]) key = 'home';
    current = key;
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === key); });
    var f = frameFor(key);
    f.classList.add('on');
    navEl.querySelectorAll('.nav-item').forEach(function (n) { n.classList.toggle('on', n.dataset.key === key); });
    titleEl.textContent = SCREENS[key].title;
    subEl.textContent = SCREENS[key].sub;
    try { history.replaceState(null, '', '?tab=' + key); } catch (_) {}
    if (isMobile()) { sizeFrame(f); window.scrollTo({ top:0, behavior:'smooth' }); }
  }

  /* ── Mobile: iOS/Android will not scroll a fixed iframe's overflow, so
        below 900px the document scrolls and each frame is sized to its own
        content. ResizeObserver misses late-loading content, hence the poll. */
  function isMobile() { return window.matchMedia('(max-width:900px)').matches; }
  function sizeFrame(f) {
    if (!isMobile()) { f.style.height = ''; return; }
    try {
      var doc = f.contentDocument; if (!doc || !doc.body) return;
      var h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 400);
      f.style.height = (h + 24) + 'px';
      if (!f.__ro && window.ResizeObserver) {
        f.__ro = new ResizeObserver(function () { sizeFrame(f); });
        f.__ro.observe(doc.body);
      }
    } catch (_) { /* cross-origin can't happen here (same-origin), ignore */ }
  }
  setInterval(function () {           // fallback the observer needs
    if (isMobile() && current && frames[current]) sizeFrame(frames[current]);
  }, 1200);
  window.addEventListener('resize', function () {
    if (!isMobile()) Object.keys(frames).forEach(function (k) { frames[k].style.height = ''; });
    else if (current) sizeFrame(frames[current]);
  });

  /* ── Sidebar collapse + mobile drawer ──────────────────────────────── */
  var COLLAPSE_KEY = 'to_sidebar_collapsed';
  try { if (localStorage.getItem(COLLAPSE_KEY) === '1') shell.classList.add('collapsed'); } catch (_) {}
  function toggleCollapse() {
    shell.classList.toggle('collapsed');
    try { localStorage.setItem(COLLAPSE_KEY, shell.classList.contains('collapsed') ? '1' : '0'); } catch (_) {}
  }
  document.getElementById('collapse-btn').addEventListener('click', toggleCollapse);
  function closeDrawer() { shell.classList.remove('drawer'); document.getElementById('scrim').classList.remove('on'); }
  // One Menu button, two jobs. Below 900px the sidebar is an overlay drawer, so
  // Menu slides it in. Above that the sidebar is part of the layout, so Menu
  // expands/collapses it — which is what makes the nav reachable again when the
  // sidebar has been collapsed down to icons on a full-screen window.
  document.getElementById('hamb').addEventListener('click', function () {
    if (isMobile()) {
      shell.classList.toggle('drawer');
      document.getElementById('scrim').classList.toggle('on', shell.classList.contains('drawer'));
    } else {
      toggleCollapse();
    }
  });

  /* ── Theme: shell owns it, broadcasts into every frame ─────────────── */
  var THEME_KEY = 'to_theme';
  function theme() { try { return localStorage.getItem(THEME_KEY) || 'light'; } catch (_) { return 'light'; } }
  function pushTheme(f) {
    try { f.contentWindow.postMessage({ type:'theme', theme:theme() }, window.location.origin); } catch (_) {}
  }
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (_) {}
    Object.keys(frames).forEach(function (k) { pushTheme(frames[k]); });
  }
  document.getElementById('theme-btn').addEventListener('click', function () {
    setTheme(theme() === 'dark' ? 'light' : 'dark');
  });
  setTheme(theme());

  /* ── Command palette (⌘K) ──────────────────────────────────────────── */
  var pal = document.getElementById('palette');
  var palIn = document.getElementById('pal-input');
  var palList = document.getElementById('pal-list');
  var scrim = document.getElementById('scrim');
  var results = [], sel = 0, searchTimer = null;

  function openPal() {
    pal.classList.add('on'); scrim.classList.add('on');
    palIn.value = ''; renderPal(screenMatches(''));
    setTimeout(function () { palIn.focus(); }, 20);
  }
  function closePal() { pal.classList.remove('on'); scrim.classList.remove('on'); }
  scrim.addEventListener('click', function () { closePal(); closeDrawer(); });
  document.getElementById('pal-btn').addEventListener('click', openPal);

  function screenMatches(q) {
    q = q.toLowerCase().trim();
    return Object.keys(SCREENS)
      .filter(function (k) {
        var s = SCREENS[k];
        return !q || (s.title + ' ' + s.sub + ' ' + k).toLowerCase().indexOf(q) >= 0;
      })
      .map(function (k) {
        return { kind:'screen', key:k, title:SCREENS[k].title, sub:SCREENS[k].sub, icon:SCREENS[k].icon };
      });
  }

  function renderPal(items) {
    results = items; sel = 0;
    if (!items.length) {
      palList.innerHTML = '<div class="empty"><div class="t">Nothing matches</div>' +
        '<div class="scope">Searched screen names and, when the server answers, leads and calls.</div></div>';
      return;
    }
    palList.innerHTML = items.map(function (it, i) {
      return '<div class="pal-item' + (i === 0 ? ' sel' : '') + '" data-i="' + i + '">' +
        '<span class="ic">' + (it.icon || I.crm) + '</span>' +
        '<span class="grow"><div>' + esc(it.title) + '</div>' +
        (it.sub ? '<div class="sub">' + esc(it.sub) + '</div>' : '') + '</span></div>';
    }).join('');
    palList.querySelectorAll('.pal-item').forEach(function (el) {
      el.addEventListener('click', function () { choose(results[+el.dataset.i]); });
    });
  }

  function choose(it) {
    if (!it) return;
    closePal();
    if (it.kind === 'screen') { activate(it.key); return; }
    if (it.kind === 'lead') { activate('crm'); return; }
    if (it.kind === 'call') { activate('phones'); return; }
  }

  palIn.addEventListener('input', function () {
    var q = palIn.value;
    renderPal(screenMatches(q));                  // instant, local
    clearTimeout(searchTimer);
    if (!q.trim()) return;
    searchTimer = setTimeout(function () {        // then fold in server hits
      fetch('/api/search?q=' + encodeURIComponent(q))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (!d || palIn.value !== q) return;
          var extra = (d.results || []).map(function (r) {
            return { kind:r.kind, key:r.key, title:r.title, sub:r.sub, icon:r.kind === 'call' ? I.phone : I.crm };
          });
          if (extra.length) renderPal(screenMatches(q).concat(extra));
        })
        .catch(function () {});
    }, 180);
  });

  palIn.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closePal(); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = Math.max(0, Math.min(results.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1)));
      palList.querySelectorAll('.pal-item').forEach(function (el, i) { el.classList.toggle('sel', i === sel); });
      var cur = palList.querySelector('.pal-item.sel'); if (cur) cur.scrollIntoView({ block:'nearest' });
      return;
    }
    if (e.key === 'Enter') { e.preventDefault(); choose(results[sel]); }
  });

  /* ── Global keys ───────────────────────────────────────────────────── */
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); }
    if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); toggleCollapse(); }
    if (e.key === 'Escape') { closePal(); closeDrawer(); }
  });

  /* ── Screens can drive navigation (Jarvis's open_dashboard tool) ────── */
  window.addEventListener('message', function (e) {
    var d = e.data || {};
    if ((d.type === 'operator-navigate' || d.type === 'arlo-navigate') && d.tab) {
      var k = String(d.tab).toLowerCase();
      var alias = { arlo:'jarvis', voice:'jarvis', calls:'phones', content:'home', seo:'home',
                    integrations:'sync', billing:'money', invoices:'money', dashboard:'home' };
      activate(alias[k] || k);
    }
    if (d.type === 'navigate' && d.tab) activate(String(d.tab).toLowerCase());
  });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  /* ── Boot: ?tab= deep-link, else home ──────────────────────────────── */
  var initial = 'home';
  try {
    var t = new URLSearchParams(location.search).get('tab');
    if (t && SCREENS[t.toLowerCase()]) initial = t.toLowerCase();
  } catch (_) {}
  activate(initial);
})();
</script>
</body>
</html>
