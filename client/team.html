<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Team — Aquatic OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --app-bg:#F4F7F9; --card:#FFFFFF; --card-2:#F8FAFB; --border:#E5EBEF; --border-strong:#D3DDE3;
    --text:#0E1B24; --body:#33454F; --muted:#6B7C86; --faint:#9AA9B2;
    --red:#D9301B; --red-hover:#BC2714; --teal:#15A6BC; --teal-deep:#0E8194; --teal-soft:rgba(21,166,188,0.10);
    --success:#12B76A; --danger:#E5484D;
    --shadow-sm:0 1px 2px rgba(14,27,36,0.06);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; background:var(--app-bg); color:var(--text); font-family:var(--sans); }
  .container { max-width:860px; margin:0 auto; padding:24px 24px 60px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding-bottom:18px; border-bottom:1px solid var(--border); }
  h1 { font-size:20px; font-weight:700; }
  .head-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:var(--shadow-sm); margin-bottom:18px; }
  .card h2 { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin-bottom:14px; }
  .user-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border); font-size:14px; }
  .user-row:first-of-type { border-top:none; }
  .user-row b { color:var(--text); }
  .role-tag { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:12px; background:var(--teal-soft); color:var(--teal-deep); }
  .role-tag.owner { background:rgba(217,48,27,0.08); color:var(--red); }
  .dim { color:var(--muted); font-size:12.5px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  input, select { width:100%; margin-top:5px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:var(--card); color:var(--text); font-size:13.5px; font-family:var(--sans); }
  input:focus, select:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  button { padding:10px 16px; border-radius:9px; border:1px solid var(--border); background:var(--card); color:var(--body); font-size:13.5px; font-weight:600; font-family:var(--sans); cursor:pointer; transition:.15s; }
  button:hover { background:var(--card-2); }
  button.primary { background:var(--red); color:#fff; border-color:transparent; }
  button.primary:hover { background:var(--red-hover); }
  button.danger { color:var(--danger); }
  #toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%) translateY(80px); background:var(--text); color:#fff; font-size:13px; padding:11px 18px; border-radius:10px; transition:.25s; opacity:0; z-index:50; }
  #toast.show { transform:translateX(-50%); opacity:1; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Team &amp; Access</h1>
        <div class="head-sub">Who can sign in, and what they can see</div>
      </div>
      <button id="logout">Sign out</button>
    </header>

    <div class="card">
      <h2>Members</h2>
      <div id="userList" class="dim">Loading…</div>
    </div>

    <div class="card">
      <h2>Add a member</h2>
      <div class="grid">
        <label>Name<input type="text" id="nuName" placeholder="Full name" /></label>
        <label>Username<input type="text" id="nuUser" placeholder="lowercase, no spaces" autocapitalize="none" /></label>
        <label>Role
          <select id="nuRole">
            <option value="sales">Sales Manager — leads &amp; outreach only</option>
            <option value="pm">Project Manager — builds, subs &amp; payments</option>
            <option value="owner">Owner — everything</option>
          </select>
        </label>
        <label>Password<input type="password" id="nuPass" placeholder="min 8 characters" /></label>
      </div>
      <button class="primary" id="nuAdd" style="margin-top:14px">Add member</button>
    </div>

    <div class="card">
      <h2>Change my password</h2>
      <div class="grid">
        <label>Current password<input type="password" id="pwCur" /></label>
        <label>New password<input type="password" id="pwNew" placeholder="min 8 characters" /></label>
      </div>
      <button class="primary" id="pwSave" style="margin-top:14px">Update password</button>
    </div>
  </div>
  <div id="toast"></div>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); },2600); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  var ROLE_LABEL = { owner:"Owner", sales:"Sales Manager", pm:"Project Manager" };

  function load(){
    fetch("/api/auth/users").then(function(r){ return r.json(); }).then(function(d){
      if (!d.ok){ $("userList").textContent = "Owner access required."; return; }
      $("userList").innerHTML = d.users.map(function(u){
        return '<div class="user-row"><b>' + esc(u.name || u.username) + '</b>' +
          '<span class="dim">@' + esc(u.username) + '</span>' +
          '<span class="role-tag ' + esc(u.role) + '">' + (ROLE_LABEL[u.role] || esc(u.role)) + '</span>' +
          '<button class="danger" data-del="' + u.id + '" style="margin-left:auto">Remove</button></div>';
      }).join("");
    }).catch(function(){ $("userList").textContent = "Couldn't load members."; });
  }

  $("userList").addEventListener("click", function(e){
    var b = e.target.closest("[data-del]");
    if (!b) return;
    if (!confirm("Remove this member? They'll be signed out immediately.")) return;
    fetch("/api/auth/users/" + b.getAttribute("data-del"), { method:"DELETE" })
      .then(function(r){ return r.json(); })
      .then(function(d){ toast(d.ok ? "Member removed" : (d.error || "Failed")); load(); });
  });

  $("nuAdd").addEventListener("click", function(){
    fetch("/api/auth/users", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ name:$("nuName").value, username:$("nuUser").value, role:$("nuRole").value, password:$("nuPass").value }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok){ toast(d.error || "Failed"); return; }
        $("nuName").value=""; $("nuUser").value=""; $("nuPass").value="";
        toast("Member added"); load();
      });
  });

  $("pwSave").addEventListener("click", function(){
    fetch("/api/auth/password", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ current:$("pwCur").value, next:$("pwNew").value }) })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d.ok){ toast(d.error || "Failed"); return; }
        $("pwCur").value=""; $("pwNew").value="";
        toast("Password updated");
      });
  });

  $("logout").addEventListener("click", function(){
    fetch("/api/auth/logout", { method:"POST" }).then(function(){ window.top.location.href = "/login"; });
  });

  load();
})();
</script>
</body>
</html>
