<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Totally Outdoors · Sign in</title>
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/signal.css" />
<script src="/theme-sync.js"></script>
<style>
  /* Screen-specific: a single centred card on the page background. */
  html, body { min-height: 100%; }
  body {
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
  }
  .signin {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--r-card);
    box-shadow: var(--sh-lift);
    padding: 32px 30px 28px;
    width: 100%; max-width: 400px;
    animation: pop .35s var(--ease) both;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

  .mark { display: flex; justify-content: center; margin-bottom: 18px; }
  .mark img { width: 84px; height: 84px; object-fit: contain; }

  .signin h1 { font-size: 21px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); text-align: center; }
  .signin .sub { font-size: 13px; color: var(--muted); margin: 5px 0 22px; text-align: center; }

  .signin .btn { width: 100%; margin-top: 20px; padding: 11px 14px; font-size: 14px; }

  /* The error slot is a signal .notice.down; JS only toggles .show on it. */
  .err { display: none; margin-top: 14px; }
  .err.show { display: flex; }
</style>
</head>
<body>
  <form class="signin" id="form">
    <div class="mark"><img src="/assets/totally-outdoors-logo.png" alt="Totally Outdoors LLC" /></div>
    <h1>Totally Outdoors OS</h1>
    <div class="sub">Totally Outdoors LLC — sign in to continue</div>

    <label class="field"><span>Username</span>
      <input type="text" id="username" autocomplete="username" autocapitalize="none" autofocus required />
    </label>
    <label class="field"><span>Password</span>
      <input type="password" id="password" autocomplete="current-password" required />
    </label>

    <button type="submit" id="go" class="btn btn-accent">Sign in</button>
    <div class="notice down err" id="err"></div>
  </form>
<script>
(function(){
  "use strict";
  var form = document.getElementById("form"), err = document.getElementById("err"), go = document.getElementById("go");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    err.classList.remove("show");
    go.disabled = true; go.textContent = "Signing in…";
    fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value })
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (!res.ok || !res.d.ok){
          err.textContent = (res.d && res.d.error) || "Sign-in failed";
          err.classList.add("show");
          go.disabled = false; go.textContent = "Sign in";
          return;
        }
        location.href = res.d.user && res.d.user.role === "owner" ? "/" : "/crm";
      })
      .catch(function(){
        err.textContent = "Couldn't reach the server — try again";
        err.classList.add("show");
        go.disabled = false; go.textContent = "Sign in";
      });
  });
})();
</script>
</body>
</html>
