<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — Totally Outdoors OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --app-bg:#0E1B24; --card:#FFFFFF; --border:#E5EBEF; --text:#0E1B24; --body:#33454F;
    --muted:#6B7C86; --red:#D9301B; --red-hover:#BC2714; --teal:#15A6BC; --teal-soft:rgba(21,166,188,0.10);
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100%; }
  body { background:linear-gradient(160deg, #0E1B24 0%, #13242f 60%, #0e2733 100%); font-family:var(--sans); display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .card { background:var(--card); border-radius:18px; padding:38px 34px 32px; width:100%; max-width:400px; box-shadow:0 30px 80px -20px rgba(0,0,0,0.5); animation:pop .4s cubic-bezier(.3,1.3,.6,1) both; }
  @keyframes pop { from { opacity:0; transform:translateY(14px) scale(.97); } to { opacity:1; transform:none; } }
  .orb { width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 34% 30%, #3fc9dd, #0E8194 78%); margin-bottom:18px; position:relative; }
  .orb::after { content:""; position:absolute; left:10px; top:9px; width:10px; height:10px; border-radius:50%; background:rgba(255,255,255,0.85); }
  h1 { font-size:21px; font-weight:700; color:var(--text); letter-spacing:-0.01em; }
  .sub { font-size:13px; color:var(--muted); margin:5px 0 24px; }
  label { display:block; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px 13px; border:1px solid var(--border); border-radius:10px; font-size:14.5px; font-family:var(--sans); color:var(--text); transition:.15s; }
  input:focus { outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); }
  button { width:100%; margin-top:22px; padding:13px; border:none; border-radius:10px; background:var(--red); color:#fff; font-size:14.5px; font-weight:600; font-family:var(--sans); cursor:pointer; transition:.15s; }
  button:hover { background:var(--red-hover); }
  button:disabled { opacity:.6; cursor:default; }
  .err { display:none; margin-top:14px; padding:10px 13px; border-radius:9px; background:rgba(229,72,77,0.08); border:1px solid rgba(229,72,77,0.25); color:#C2333C; font-size:13px; }
  .err.show { display:block; }
</style>
</head>
<body>
  <form class="card" id="form">
    <div class="orb"></div>
    <h1>Totally Outdoors OS</h1>
    <div class="sub">Totally Outdoors LLC — sign in to continue</div>
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" autocapitalize="none" autofocus required />
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required />
    <button type="submit" id="go">Sign in</button>
    <div class="err" id="err"></div>
  </form>
<script>
(function(){
  "use strict";
  var form = document.getElementById("form"), err = document.getElementById("err"), go = document.getElementById("go");
  form.addEventListener("submit", function(e){
    e.preventDefault();
    err.classList.remove("show");
    go.disabled = true; go.textContent = "Signing in…";
    fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("username").value, password: document.getElementById("password").value })
    }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if (!res.ok || !res.d.ok){
          err.textContent = (res.d && res.d.error) || "Sign-in failed";
          err.classList.add("show");
          go.disabled = false; go.textContent = "Sign in";
          return;
        }
        location.href = res.d.user && res.d.user.role === "owner" ? "/" : "/crm";
      })
      .catch(function(){
        err.textContent = "Couldn't reach the server — try again";
        err.classList.add("show");
        go.disabled = false; go.textContent = "Sign in";
      });
  });
})();
</script>
</body>
</html>
