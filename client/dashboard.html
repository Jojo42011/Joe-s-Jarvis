<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Totally Outdoors OS · Home</title>
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/signal.css" />
<script src="/theme-sync.js"></script>
<style>
  /* ── Branded hero: the Totally Outdoors mark, alive ──────────────────
     A slow drift of light across the badge plus a soft pulse ring. The
     motion is decorative only — nothing here reports state, so it can
     never be mistaken for a live indicator. */
  /* Three columns: the greeting reads left, the mark sits dead centre, and the
     one number Joe is accountable for anchors the right. The centre column is
     `justify-self:center` against the hero box (not the text), so the mark stays
     centred no matter how long the greeting runs. */
  .hero.brand-hero {
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:22px; padding:24px 26px;
  }
  .hero.brand-hero > .grow { min-width:0; }
  .hero .hero-count { justify-self:end; text-align:right; }
  .hero .hero-count .n { font-size:40px; font-weight:800; line-height:1; letter-spacing:-.02em; }
  .hero .hero-count .l {
    font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    opacity:.82; margin-top:6px;
  }
  .hero.brand-hero::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 46%,transparent 62%);
    background-size:280% 100%; animation:sheen 7s var(--ease) infinite;
  }
  @keyframes sheen { 0% { background-position:180% 0; } 55%,100% { background-position:-80% 0; } }

  .markwrap { position:relative; flex:0 0 auto; width:96px; height:96px; display:flex; align-items:center; justify-content:center; }
  .markwrap img { width:92px; height:92px; object-fit:contain; position:relative; z-index:2;
                  filter:drop-shadow(0 6px 14px rgba(0,0,0,.35)); animation:markFloat 6s ease-in-out infinite; }
  @keyframes markFloat { 0%,100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-5px) scale(1.015); } }
  .markwrap .ring {
    position:absolute; inset:2px; border-radius:50%; z-index:1;
    border:1.5px solid rgba(255,255,255,.35); animation:ringPulse 3.4s var(--ease) infinite;
  }
  .markwrap .ring:nth-child(2) { animation-delay:1.7s; }
  @keyframes ringPulse {
    0% { transform:scale(.82); opacity:.5; }
    70% { transform:scale(1.28); opacity:0; }
    100% { transform:scale(1.28); opacity:0; }
  }
  .hero .eyebrow { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; opacity:.82; }
  @media (prefers-reduced-motion:reduce) {
    .hero.brand-hero::after, .markwrap img, .markwrap .ring { animation:none; }
  }
  @media (max-width:820px) {
    .hero.brand-hero { grid-template-columns:1fr; justify-items:start; gap:14px; }
    .hero .hero-count { justify-self:start; text-align:left; }
    .markwrap { width:72px; height:72px; } .markwrap img { width:70px; height:70px; }
  }

  .agent { display:flex; gap:13px; align-items:flex-start; padding:14px 18px; border-bottom:1px solid var(--divider); }
  .agent:last-child { border-bottom:none; }
  .agent .nm { font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
  .agent .rl { font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .agent .hl { font-size:13px; color:var(--ink-2); margin-top:5px; }
  .agent .dt { font-size:12.5px; color:var(--money); margin-top:4px; }
  .wait-item { display:flex; gap:11px; align-items:center; padding:11px 18px; border-bottom:1px solid var(--divider); }
  .wait-item:last-child { border-bottom:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Branded hero -->
  <div class="hero brand-hero">
    <div class="grow">
      <div class="eyebrow" id="hero-date">Totally Outdoors Landscaping</div>
      <h1 id="greet">Good morning, Joe.</h1>
      <div class="sub" id="hero-sub">Landscaping, hardscaping and excavating · Holmes County, Ohio · since 2004</div>
      <div class="row-actions">
        <button class="btn btn-sm" data-go="jarvis">Ask Jarvis</button>
        <button class="btn btn-sm" data-go="sweep">What I missed</button>
        <button class="btn btn-sm" data-go="crm">Open CRM</button>
      </div>
    </div>

    <div class="markwrap">
      <span class="ring"></span><span class="ring"></span>
      <img src="/assets/totally-outdoors-logo.png" alt="Totally Outdoors LLC" />
    </div>

    <!-- Starts as an em dash, not 0: until /api/home answers we do not know
         how many things are waiting, and a confident 0 would be a lie. -->
    <div class="hero-count">
      <div class="n" id="hero-wait">—</div>
      <div class="l">Waiting on you</div>
    </div>
  </div>

  <div id="err"></div>

  <!-- KPIs -->
  <div class="kpis" id="kpis" style="margin-bottom:18px">
    <div class="kpi"><div class="n" id="k-open">–</div><div class="l">Open leads</div></div>
    <div class="kpi"><div class="n money" id="k-forecast">–</div><div class="l">Weighted forecast</div></div>
    <div class="kpi"><div class="n amber" id="k-waiting">–</div><div class="l">Waiting on you</div></div>
    <div class="kpi"><div class="n green" id="k-today">–</div><div class="l">On today</div></div>
  </div>

  <div class="cards two">
    <div>
      <!-- The team -->
      <div class="card">
        <div class="head"><h2>The team</h2><span class="meta" id="team-meta"></span></div>
        <div id="agents"><div class="empty">Loading…</div></div>
      </div>

      <!-- Waiting on you -->
      <div class="card">
        <div class="head"><h2>Waiting on you</h2><span id="wait-count"></span></div>
        <div id="waiting"><div class="empty">Loading…</div></div>
      </div>
    </div>

    <div>
      <!-- Today -->
      <div class="card">
        <div class="head"><h2>Today</h2><span class="meta" id="today-date"></span></div>
        <div id="today"><div class="empty">Loading…</div></div>
      </div>

      <!-- Recent leads -->
      <div class="card">
        <div class="head"><h2>Recent leads</h2><button class="btn btn-sm btn-ghost" data-go="crm">Open CRM</button></div>
        <div id="leads"><div class="empty">Loading…</div></div>
      </div>
    </div>
  </div>

  <div class="meta center" id="stamp" style="margin-top:6px"></div>
</div>

<script>
(function () {
  "use strict";

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }
  function money(cents) {
    return '$' + (Number(cents || 0) / 100).toLocaleString('en-US', { maximumFractionDigits:0 });
  }
  function go(tab) {
    try { window.parent.postMessage({ type:'operator-navigate', tab:tab }, '*'); } catch (_) {}
  }
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.addEventListener('click', function () { go(b.dataset.go); });
  });

  function when(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function clock(iso) {
    if (!iso) return '';
    var d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit' });
  }

  // Greeting follows Ohio time, not the browser's guess.
  (function () {
    var h = Number(new Date().toLocaleString('en-US', { timeZone:'America/New_York', hour:'numeric', hour12:false }));
    var part = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
    document.getElementById('greet').textContent = part + ', Joe.';
    document.getElementById('hero-date').textContent =
      new Date().toLocaleDateString('en-US', { timeZone:'America/New_York', weekday:'long', month:'long', day:'numeric' });
    document.getElementById('today-date').textContent =
      new Date().toLocaleDateString('en-US', { timeZone:'America/New_York', weekday:'long', month:'short', day:'numeric' });
  })();

  function fail(msg) {
    document.getElementById('err').innerHTML =
      '<div class="notice down" style="margin-bottom:16px">' + esc(msg) + '</div>';
  }

  function render(d) {
    // ── KPIs ──
    document.getElementById('k-open').textContent = d.pipeline.openLeads;

    var fc = document.getElementById('k-forecast');
    if (d.pipeline.weightedUnconfirmed) {
      // Rule 1: a forecast with nothing to compute from is unconfirmed, not $0.
      fc.className = 'n unconfirmed';
      fc.textContent = 'unconfirmed';
      fc.title = 'No open lead carries a project value yet, so a forecast cannot be computed.';
    } else {
      fc.className = 'n money';
      fc.textContent = money(d.pipeline.weightedCents);
      fc.title = 'Weighted across ' + d.pipeline.valuedLeads + ' valued lead(s).';
    }

    var w = d.waiting;
    var waitTotal = w.emailDrafts.length + w.unsentInvoices.length + w.lateMaterials.length;
    document.getElementById('k-waiting').textContent = waitTotal;
    document.getElementById('hero-wait').textContent = waitTotal;

    var appts = d.appointments;
    var kToday = document.getElementById('k-today');
    if (!appts.connected) {
      kToday.className = 'n unconfirmed'; kToday.textContent = 'not connected';
      kToday.title = 'No calendar is connected, so today’s appointments are unknown.';
    } else {
      kToday.className = 'n green'; kToday.textContent = appts.today.length;
    }

    // ── Agents ──
    document.getElementById('agents').innerHTML = d.agents.map(function (a) {
      return '<div class="agent">' +
        '<span class="avatar' + (a.name === 'Sofia' ? ' green' : ' indigo') + '">' + esc(a.name.slice(0,2).toUpperCase()) + '</span>' +
        '<span class="grow">' +
          '<div class="nm">' + esc(a.name) +
            '<span class="dot ' + (a.live ? 'live' : 'down') + '"></span>' +
            '<span class="pill ' + (a.live ? 'green' : 'quiet') + '">' + (a.live ? 'Live' : 'Idle') + '</span>' +
          '</div>' +
          '<div class="rl">' + esc(a.role) + '</div>' +
          '<div class="hl">' + esc(a.headline) + '</div>' +
          (a.detail ? '<div class="dt">' + esc(a.detail) + '</div>' : '') +
        '</span></div>';
    }).join('');
    document.getElementById('team-meta').textContent = d.agents.filter(function (a) { return a.live; }).length + ' of ' + d.agents.length + ' live';

    // ── Waiting on you ──
    var wc = document.getElementById('wait-count');
    wc.innerHTML = waitTotal ? '<span class="badge amber">' + waitTotal + '</span>' : '';
    var rows = [];
    w.emailDrafts.forEach(function (x) {
      rows.push('<div class="wait-item"><span class="pill indigo">Email</span>' +
        '<span class="grow truncate"><b>' + esc(x.subject || '(no subject)') + '</b> — reply drafted for ' + esc(x.from || 'unknown') + '</span>' +
        '<button class="btn btn-sm" data-go="approve">Review</button></div>');
    });
    w.unsentInvoices.forEach(function (x) {
      rows.push('<div class="wait-item"><span class="pill money">Invoice</span>' +
        '<span class="grow truncate">' + esc(x.invoice_no || '') + ' — ' + esc(x.lead) + ' · ' + esc(x.label || '') + ' ' + money(x.amount_cents) + ' ready to send</span>' +
        '<button class="btn btn-sm" data-go="money">Send</button></div>');
    });
    w.lateMaterials.forEach(function (x) {
      rows.push('<div class="wait-item"><span class="pill amber">Materials</span>' +
        '<span class="grow truncate">' + esc(x.po || '') + ' for ' + esc(x.lead || 'a project') + ' is still ' + esc(x.status) + ' but the job has reached that stage</span>' +
        '<button class="btn btn-sm" data-go="materials">Open</button></div>');
    });
    document.getElementById('waiting').innerHTML = rows.length
      ? rows.join('')
      : '<div class="empty"><div class="t">Nothing waiting on you</div>' +
        '<div class="scope">Covers email replies Jarvis drafted, milestone invoices ready to send, and purchase orders a job has already passed the stage for.</div></div>';

    // ── Today ──
    var t = document.getElementById('today');
    if (!appts.connected) {
      t.innerHTML = '<div class="empty"><div class="t">No calendar connected</div>' +
        '<div class="scope">Connect a Google account in Integrations and today’s appointments will appear here.</div>' +
        '<button class="btn btn-sm" style="margin-top:10px" data-go="sync">Open Integrations</button></div>';
    } else if (!appts.today.length) {
      t.innerHTML = '<div class="empty"><div class="t">Nothing on the calendar today</div>' +
        '<div class="scope">Read from the connected Google calendar(s).</div></div>';
    } else {
      t.innerHTML = appts.today.map(function (e) {
        return '<div class="row"><span class="pill green">' + esc(clock(e.start)) + '</span>' +
          '<span class="grow"><div class="t">' + esc(e.summary || '(no title)') + '</div>' +
          (e.location ? '<div class="s truncate">' + esc(e.location) + '</div>' : '') + '</span></div>';
      }).join('');
    }

    // ── Recent leads ──
    var l = document.getElementById('leads');
    l.innerHTML = d.recentLeads.length
      ? d.recentLeads.map(function (x) {
          return '<div class="row"><span class="avatar">' + esc((x.name || '?').slice(0,2).toUpperCase()) + '</span>' +
            '<span class="grow"><div class="t truncate">' + esc(x.name) + '</div>' +
            '<div class="s truncate">' + esc(x.message || x.phone || '') + '</div></span>' +
            '<span class="pill quiet">' + esc(x.pipeline || 'new') + '</span>' +
            '<span class="meta">' + esc(when(x.created_at)) + '</span></div>';
        }).join('')
      : '<div class="empty"><div class="t">No leads yet</div><div class="scope">Every lead from Sofia, the website and manual entry lands here.</div></div>';

    // Re-bind any buttons rendered above.
    document.querySelectorAll('[data-go]').forEach(function (b) {
      if (b.__bound) return; b.__bound = true;
      b.addEventListener('click', function () { go(b.dataset.go); });
    });

    document.getElementById('stamp').textContent = 'Live figures · refreshed ' + clock(d.generatedAt);
  }

  function load() {
    fetch('/api/home')
      .then(function (r) { if (!r.ok) throw new Error('Server returned ' + r.status); return r.json(); })
      .then(function (d) { document.getElementById('err').innerHTML = ''; render(d); })
      .catch(function (e) {
        // "Could not reach the server" is a different fact from "there is nothing".
        fail('Could not load the dashboard — ' + e.message + '. The figures below may be stale or missing; nothing here is invented.');
      });
  }

  load();
  setInterval(function () { if (!document.hidden) load(); }, 60000);
})();
</script>
</body>
</html>
