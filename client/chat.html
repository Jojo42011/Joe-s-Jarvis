<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Totally Outdoors OS · Chat</title>
<link rel="stylesheet" href="/fonts.css" />
<link rel="stylesheet" href="/signal.css" />
<script src="/theme-sync.js"></script>
<style>
  /* ── Chat is a full-height column: header, thread, composer. ─────────── */
  :root { --column: 760px; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }

  /* ── Header ── */
  header {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    padding: 12px max(22px, env(safe-area-inset-right)) 12px max(22px, env(safe-area-inset-left));
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 700;
    letter-spacing: .22em; text-transform: uppercase; color: var(--ink);
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); animation: breathe 3s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion:reduce) { .brand .dot { animation: none; } }

  /* ── Thread ── */
  #scroll { flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; }
  #thread { max-width: var(--column); margin: 0 auto; padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 18px; }

  /* Empty state */
  #empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px; min-height: 55vh; }
  #empty h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
  #empty p { margin-top: 10px; color: var(--muted); font-size: 14.5px; }
  #chips { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 24px; }
  .chip {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; cursor: pointer;
    border: 1px solid var(--border-strong); border-radius: var(--r-pill);
    background: var(--panel); color: var(--ink-2); box-shadow: var(--sh-rest);
    transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-bg); }

  /* Messages — both sides are cards; Joe's turn is brand-tinted, Jarvis's is a panel. */
  .turn { display: flex; }
  .turn.user { justify-content: flex-end; }
  .turn.user .bubble {
    max-width: 82%; background: var(--brand-bg); color: var(--ink);
    border: 1px solid var(--border); border-radius: var(--r-card) var(--r-card) 4px var(--r-card);
    padding: 12px 16px; font-size: 14.5px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; box-shadow: var(--sh-rest);
  }
  .turn.bot { gap: 12px; align-items: flex-start; }
  .turn.bot .avatar {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; margin-top: 2px;
    background: var(--mark); box-shadow: var(--sh-rest);
  }
  .bot .body {
    flex: 1 1 auto; font-size: 14.5px; line-height: 1.7; max-width: calc(100% - 42px); word-break: break-word;
    background: var(--panel); color: var(--ink-2);
    border: 1px solid var(--border); border-radius: var(--r-card) var(--r-card) var(--r-card) 4px;
    padding: 12px 16px; box-shadow: var(--sh-rest);
  }
  .bot .body p { margin: 0 0 10px; } .bot .body p:last-child { margin-bottom: 0; }
  .bot .body code { font-family: var(--mono); font-size: 12.5px; background: var(--fill); color: var(--ink); padding: 2px 6px; border-radius: 5px; }
  .bot .body pre { background: var(--panel-alt); border: 1px solid var(--border); border-radius: var(--r-btn); padding: 12px 14px; overflow-x: auto; margin: 10px 0; }
  .bot .body pre code { background: none; padding: 0; }
  .bot .body ul { margin: 8px 0 8px 20px; } .bot .body li { margin: 4px 0; }
  .bot .body b { font-weight: 700; color: var(--ink); }
  .bot .body .err { color: var(--money); }
  .caret { display: inline-block; width: 7px; height: 15px; background: var(--brand); margin-left: 2px; vertical-align: -2px; animation: blink .9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Typing dots */
  .dots { display: inline-flex; gap: 5px; padding: 4px 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: hop 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }

  /* ── Composer ── */
  #composer-wrap {
    flex: 0 0 auto;
    padding: 10px max(18px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    background: var(--bg);
  }
  #composer {
    max-width: var(--column); margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
    background: var(--panel); border: 1px solid var(--border-strong); border-radius: 26px;
    padding: 8px 8px 8px 18px; box-shadow: var(--sh-rest);
    transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
  }
  #composer:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
  #input {
    flex: 1; width: auto; background: none; border: none; outline: none; resize: none; color: var(--ink);
    font-family: inherit; font-size: 14.5px; line-height: 1.55; padding: 8px 0; max-height: 160px; border-radius: 0;
  }
  #input:focus { outline: none; border: none; box-shadow: none; }
  #input::placeholder { color: var(--muted); }
  #send {
    flex: 0 0 auto; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center;
    transition: opacity .15s var(--ease), transform .15s var(--ease), background .15s var(--ease);
  }
  #send:not(:disabled):hover { background: var(--brand-deep); transform: translateY(-1px); }
  #send:disabled { opacity: .35; cursor: default; }
  #send svg { width: 17px; height: 17px; }
  #hint { max-width: var(--column); margin: 8px auto 0; text-align: center; }
  #hint span { display: inline-block; width: 44px; height: 4px; border-radius: 4px; background: var(--border-strong); }

  @media (max-width: 640px) {
    #empty h1 { font-size: 24px; }
    .turn.user .bubble { max-width: 92%; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span><span id="brand-name">JARVIS</span></div>
    <button id="newchat" class="btn btn-sm btn-ghost">New chat</button>
  </header>

  <div id="scroll">
    <div id="empty">
      <h1 id="empty-title">What do you need?</h1>
      <p id="empty-sub">Ask me anything.</p>
      <div id="chips"></div>
    </div>
    <div id="thread"></div>
  </div>

  <div id="composer-wrap">
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Message"></textarea>
      <button id="send" disabled title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div id="hint"><span></span></div>
  </div>

<script>
(function () {
  "use strict";

  /* ══ CONFIG — everything you'd ever touch ══════════════════════════════ */
  var CONFIG = {
    brand: "JARVIS",
    emptyTitle: "What do you need?",
    emptySub: "Ask me anything.",
    placeholder: "Message",
    chips: ["Give me a summary", "What can you do?"],

    // The one function to wire: take the user's message, return { text }.
    // Throw to show an inline error. sessionId + history come free.
    send: async function (payload) {
      var res = await fetch("/api/brain/process", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: payload.message, sessionId: payload.sessionId })
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Request failed");
      return { text: data.text || data.speech || "", navigate: data.navigate || null };
    }
  };
  /* ══ Engine — no need to edit below ════════════════════════════════════ */

  var scroll = document.getElementById("scroll");
  var thread = document.getElementById("thread");
  var empty = document.getElementById("empty");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var history = [];
  var busy = false;

  document.getElementById("brand-name").textContent = CONFIG.brand;
  document.getElementById("empty-title").textContent = CONFIG.emptyTitle;
  document.getElementById("empty-sub").textContent = CONFIG.emptySub;
  input.placeholder = CONFIG.placeholder;

  var sessionId = sessionStorage.getItem("chat-session");
  if (!sessionId) {
    sessionId = "chat-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    sessionStorage.setItem("chat-session", sessionId);
  }

  var chipsEl = document.getElementById("chips");
  CONFIG.chips.forEach(function (c) {
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = c;
    b.addEventListener("click", function () { submit(c); });
    chipsEl.appendChild(b);
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  // Markdown-lite: escape FIRST, then bold/italic/code/bullets — XSS-safe.
  function renderMd(raw) {
    var s = esc(raw);
    var blocks = [];
    s = s.replace(/```([\s\S]*?)```/g, function (_, code) {
      blocks.push("<pre><code>" + code.replace(/^\n|\n$/g, "") + "</code></pre>");
      return " " + (blocks.length - 1) + " ";
    });
    s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/(^|\s)\*([^*\n]+)\*(?=\s|$|[.,!?])/g, "$1<i>$2</i>");
    var lines = s.split("\n"), out = [], list = null;
    lines.forEach(function (ln) {
      var m = ln.match(/^\s*[-•]\s+(.*)$/);
      if (m) { (list = list || []).push("<li>" + m[1] + "</li>"); return; }
      if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
      if (ln.trim()) out.push("<p>" + ln + "</p>");
    });
    if (list) out.push("<ul>" + list.join("") + "</ul>");
    var html = out.join("");
    blocks.forEach(function (b, i) { html = html.replace(" " + i + " ", b); });
    return html || "<p></p>";
  }

  function stick() { scroll.scrollTop = scroll.scrollHeight; }

  function addUser(text) {
    var t = document.createElement("div");
    t.className = "turn user";
    var b = document.createElement("div");
    b.className = "bubble"; b.textContent = text;
    t.appendChild(b); thread.appendChild(t); stick();
  }

  function addBot() {
    var t = document.createElement("div");
    t.className = "turn bot";
    t.innerHTML = '<div class="avatar"></div><div class="body"><span class="dots"><i></i><i></i><i></i></span></div>';
    thread.appendChild(t); stick();
    return t.querySelector(".body");
  }

  // Typewriter reveal, capped ~1.5s total so long replies aren't slow.
  function typeOut(el, raw) {
    var full = renderMd(raw);
    var plain = raw.replace(/\s+/g, " ");
    var steps = Math.min(plain.length, 60);
    if (steps < 8) { el.innerHTML = full; stick(); return; }
    var per = Math.max(12, Math.floor(1500 / steps));
    var i = 0;
    var timer = setInterval(function () {
      i++;
      var slice = raw.slice(0, Math.ceil(raw.length * (i / steps)));
      el.innerHTML = renderMd(slice) ;
      var last = el.lastElementChild || el;
      var c = document.createElement("span"); c.className = "caret"; last.appendChild(c);
      stick();
      if (i >= steps) { clearInterval(timer); el.innerHTML = full; stick(); }
    }, per);
  }

  async function submit(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    empty.style.display = "none";
    input.value = ""; autosize();
    addUser(text);
    history.push({ role: "user", text: text });
    var body = addBot();
    try {
      var r = await CONFIG.send({ message: text, sessionId: sessionId, history: history.slice(0, -1) });
      var reply = (r && r.text) || "…";
      history.push({ role: "assistant", text: reply });
      typeOut(body, reply);
      // Jarvis can steer the shell ("open the CRM") from chat, same as voice.
      if (r && r.navigate && window.parent !== window) {
        window.parent.postMessage({ type: "arlo-navigate", tab: r.navigate }, "*");
      }
    } catch (err) {
      body.innerHTML = '<p class="err">' + esc(err && err.message ? err.message : "Something went wrong.") + "</p>";
    }
    busy = false;
    send.disabled = !input.value.trim();
    input.focus();
  }

  function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
  }
  input.addEventListener("input", function () { autosize(); send.disabled = !input.value.trim() || busy; });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(input.value); }
  });
  send.addEventListener("click", function () { submit(input.value); });

  document.getElementById("newchat").addEventListener("click", function () {
    history = []; thread.innerHTML = ""; empty.style.display = "";
    sessionId = "chat-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    sessionStorage.setItem("chat-session", sessionId);
    input.focus();
  });

  input.focus();
})();
</script>
</body>
</html>
