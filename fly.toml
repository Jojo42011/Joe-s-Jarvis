app = "joes-jarvis"
primary_region = "ord"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_PATH = "/data/jarvis.sqlite"
  # Secrets only via `fly secrets set` — never commit values here.
  # GEMINI_API_KEY — image finish generation (Gemini gemini-2.5-flash-image)
  # ANTHROPIC_API_KEY, BRAVE_API_KEY, DEEPGRAM_API_KEY, GMAIL_*, etc.

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "jarvis_data"
  destination = "/data"
